<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material composition and buried reveal · Phase 0.5C.1</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b21;color:#eee9d9;font:15px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;top:14px;left:14px;max-width:370px;padding:14px;background:#12242ce8;border:1px solid #57707a;border-radius:9px}button{background:#b3d3bd;color:#10211a;border:0;border-radius:6px;padding:8px 11px;font-weight:bold;margin:5px 5px 0 0;cursor:pointer}#status{color:#f5d49a}</style>
<canvas id="scene"></canvas><aside><b>Buried material composition · Phase 0.5C.1</b><p id="status">Rock is resolved beneath the dirt source. No rock surface is exposed.</p><button id="scoop">Scoop dirt</button><button id="more">Expose stone face</button><button id="reset">Reset</button></aside>
<script type="module">
import * as THREE from '../../vendor/three.module.js';import {makeBuriedMixedMatterSamples} from './matter-fixtures.js';import {meshMatterSamples} from './matter-mesh.js';
const canvas=document.querySelector('#scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);renderer.setClearColor(0x10232b);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);scene.add(new THREE.HemisphereLight(0xdbeaf0,0x3b2b23,2));const sun=new THREE.DirectionalLight(0xffddad,2.4);sun.position.set(-4,9,7);scene.add(sun);
const material=new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,side:THREE.DoubleSide,roughness:.92});let samples,terrain;
function draw(){if(terrain){scene.remove(terrain);terrain.geometry.dispose();}const data=meshMatterSamples(samples),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(data.positions,3));g.setAttribute('normal',new THREE.BufferAttribute(data.normals,3));g.setAttribute('color',new THREE.BufferAttribute(data.colors,3));g.setIndex(new THREE.BufferAttribute(data.indices,1));terrain=new THREE.Mesh(g,material);scene.add(terrain);}
function reset(){samples=makeBuriedMixedMatterSamples();draw();document.querySelector('#status').textContent='Rock is resolved beneath the dirt source. No rock surface is exposed.';}
function scoop(center,radii,label){let count=0;for(let i=0;i<samples.densities.length;i++){if(samples.densities[i]>=0||samples.materials[i]!==2)continue;const p=samples.position(i),q=p.map((v,j)=>(v-center[j])/radii[j]);if(q.reduce((sum,v)=>sum+v*v,0)<=1){samples.densities[i]=1;samples.materials[i]=0;count++;}}draw();document.querySelector('#status').textContent=`${label}: ${count} dirt samples removed; resolved rock remains protected.`;}
document.querySelector('#scoop').onclick=()=>scoop([0,4.2,0],[.75,.65,.75],'First scoop reveals a small stone patch');document.querySelector('#more').onclick=()=>scoop([0,3.9,0],[1.2,.95,1.1],'Second scoop exposes a larger irregular face');document.querySelector('#reset').onclick=reset;reset();
function frame(){requestAnimationFrame(frame);const target=[0,2.7,0];camera.position.set(0,7.2,8);camera.lookAt(...target);renderer.render(scene,camera);}requestAnimationFrame(frame);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></html>
