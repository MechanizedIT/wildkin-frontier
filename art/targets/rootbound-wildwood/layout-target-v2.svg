wn point.</text><text x="930" y="479" font-size="16" fill="#dce7d3">Small dots: current life-preservation points.</text><text x="930" y="506" font-size="16" fill="#dce7d3">Hatch: current stable-plate algorithm areas.</text><text x="930" y="533" font-size="16" fill="#dce7d3">These do not prove rendered heights.</text><text x="930" y="560" font-size="12" fill="#dce7d3"></text><text x="930" y="587" font-size="18" fill="#dce7d3">WHITE / RECORDED CAMERAS</text><text x="930" y="614" font-size="16" fill="#dce7d3">A  Arrival (-475,590), yaw -1.743</text><text x="930" y="641" font-size="16" fill="#dce7d3">B  Gallery (-480,720), yaw -1.36</text><text x="930" y="668" font-size="16" fill="#dce7d3">C  Destination (-449,675), yaw -2.3</text><text x="930" y="695" font-size="16" fill="#dce7d3">Lines show horizontal look direction.</text><text x="930" y="722" font-size="16" fill="#dce7d3">B lies at the proposed Crown threshold.</text><text x="930" y="749" font-size="12" fill="#dce7d3"></text><text x="930" y="776" font-size="18" fill="#e6bb8c">REVIEW BEFORE IMPLEMENTATION</text><text x="930" y="803" font-size="16" fill="#dce7d3">Verge moves east of Grove in this proposal.</text><text x="930" y="830" font-size="16" fill="#dce7d3">Current thorn feature overlaps the hollow.</text><text x="930" y="857" font-size="16" fill="#dce7d3">Check all route segments on final triangles,</text><text x="930" y="884" font-size="16" fill="#dce7d3">player footprint, homes, resources, assets,</text><text x="930" y="911" font-size="16" fill="#dce7d3">camera clearance, streaming and reload.</text><text x="930" y="938" font-size="16" fill="#dce7d3">The distant earned grove is not Crown.</text><text x="50" y="1050" font-size="14" fill="#a3b8ab">Source: frontierRootbound.js + restart-r2-captures.json. No proposed route, resource relocation or landmark asset is admitted by this map.</text></g></svg>
