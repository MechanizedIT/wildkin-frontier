<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Rootbound Wildwood current pattern versus target composition</title>
  <desc id="desc">A split visual guide. The left shows flat ground and evenly scattered repeated plants. The right shows terrain relief, clustered vegetation, open routes, scale hierarchy, a hero landmark, and ecological zoning.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081d24"/><stop offset="1" stop-color="#133633"/></linearGradient>
    <linearGradient id="skyL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f574b"/><stop offset="1" stop-color="#477c68"/></linearGradient>
    <linearGradient id="skyR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#153d3d"/><stop offset="1" stop-color="#5a8a70"/></linearGradient>
    <linearGradient id="groundR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#91b97b"/><stop offset=".55" stop-color="#739a66"/><stop offset="1" stop-color="#587852"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#02090c" flood-opacity=".6"/></filter>
  </defs>
  <rect width="1400" height="900" fill="url(#page)"/>
  <text x="54" y="70" fill="#f1f3df" font-family="system-ui, sans-serif" font-size="34" font-weight="760">Rootbound Wildwood — why the current view feels procedural</text>
  <text x="55" y="105" fill="#accbc0" font-family="system-ui, sans-serif" font-size="17">Fix structure before increasing density: terrain → rooms/routes → clustered ecology → lighting/detail</text>
