  <g font-family="system-ui, sans-serif"><text x="55" y="802" fill="#f0d18b" font-size="22" font-weight="800">PASS ORDER</text><text x="196" y="802" fill="#d2e3dc" font-size="18">1 terrain massing</text><text x="376" y="802" fill="#d2e3dc" font-size="18">→ 2 rooms/routes</text><text x="555" y="802" fill="#d2e3dc" font-size="18">→ 3 ecological patches</text><text x="785" y="802" fill="#d2e3dc" font-size="18">→ 4 landmarks</text><text x="949" y="802" fill="#d2e3dc" font-size="18">→ 5 lighting/detail</text><text x="55" y="846" fill="#9fc1b6" font-size="15">A stronger biome can use fewer total instances when silhouette, patch contrast, negative space and terrain shape do the composition work.</text></g>
