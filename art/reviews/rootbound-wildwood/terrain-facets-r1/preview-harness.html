<!doctype html><meta charset="utf-8"><title>Rootbound ground comparison</title><style>body{margin:0;background:#13212a;color:#edf3dd;font:14px system-ui;display:flex;gap:20px}iframe{width:412px;height:915px;border:0;flex:none}aside{max-width:500px;padding:14px}button{display:block;margin:12px 0;padding:12px}pre{white-space:pre-wrap;font-size:11px}</style><iframe id="game" src="/?scout=1"></iframe><aside><h1>Actual Rootbound ground</h1><p>Private Scout session. Diagnostic positioning only. Ground preview changes rendering only and is not admitted gameplay.</p><button id="destination">Position at Lantern threshold</button><button id="baseline">Baseline ground</button><button id="gentle">Preview gentle folds</button><button id="strong">Preview stronger folds</button><button id="measure">Read current pose</button><pre id="receipt">Start/Continue in the game, then position.</pre></aside><script type="module">
const frame=document.querySelector('#game'),receipt=document.querySelector('#receipt');
const get=()=>frame.contentWindow.__game;
document.querySelector('#destination').onclick=()=>{const g=get();g.characterPhysics.setPosition({x:-449,y:g.frontierChunks.getHeight(-449,675)+.7,z:675});g.playerController.syncPosFromPhysics();g.playerController.snapRenderPose();g.cameraFollow.orbitBy(-2.3-g.cameraFollow.getYaw());g.cameraFollow.snap();receipt.textContent='Positioned. Wait for terrain streaming and read pose.';};
const saved=new Map(),savedNormals=new Map();
const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function preview(amplitude){const g=get();let changed=0,maxDelta=0;g.scene.updateMatrixWorld(true);g.scene.traverse(o=>{if(o.name!=='frontier_ground'||!o.geometry)return;const attr=o.geometry.attributes.position;const me=o.matrixWorld.elements;if(Math.abs(me[0]-1)+Math.abs(me[5]-1)+Math.abs(me[10]-1)+Math.abs(me[1])+Math.abs(me[2])+Math.abs(me[4])+Math.abs(me[6])+Math.abs(me[8])+Math.abs(me[9])>1e-8)throw Error('Ground must use translation only');if(!saved.has(o)){saved.set(o,new Float32Array(attr.array));savedNormals.set(o,new Float32Array(o.geometry.attributes.normal.array));}const base=saved.get(o);for(let i=0;i<attr.count;i++){const v=new g.THREE.Vector3(base[3*i],base[3*i+1],base[3*i+2]).applyMatrix4(o.matrixWorld);const fade=smooth(Math.min(v.x+454,-438-v.x,v.z-670,688-v.z)/2);const d=amplitude*fade*(.65*Math.sin((v.x+448)*.93+(v.z-679)*.37)+.35*Math.sin((v.z-677)*1.13-(v.x+448)*.21));attr.setY(i,base[3*i+1]+d);if(Math.abs(d)>1e-7)changed++;maxDelta=Math.max(maxDelta,Math.abs(d));}attr.needsUpdate=true;if(amplitude)o.geometry.computeVertexNormals();else{o.geometry.attributes.normal.array.set(savedNormals.get(o));o.geometry.attributes.normal.needsUpdate=true;}o.geometry.computeBoundingSphere();});receipt.textContent=JSON.stringify({mode:amplitude?'render-only relief preview':'restored baseline',amplitude,changed,maxDelta,physics:'unchanged; do not use this preview as support proof'},null,2);}
document.querySelector('#baseline').onclick=()=>preview(0);
document.querySelector('#gentle').onclick=()=>preview(.18);
document.querySelector('#strong').onclick=()=>preview(.35);
document.querySelector('#measure').onclick=()=>{const g=get();receipt.textContent=JSON.stringify({pose:g.playerController.getState().pos,camera:g.camera.position.toArray(),cameraFollow:g.cameraFollow._debug(),terrain:g.frontierChunks.getDebugState(),render:g.renderer.info.render},null,2);};
</script>
