<!doctype html><html lang="en"><meta charset="utf-8"><title>Trailgloam — native Rootbound encounter</title>
<style>body{margin:0;display:flex;gap:18px;background:#16272c;color:#e9eedc;font:14px system-ui}iframe{width:412px;height:915px;border:0;flex:none}aside{max-width:460px;padding:16px}button,select{display:block;padding:10px;margin:10px 0}pre{white-space:pre-wrap;font-size:11px}</style>
<iframe id="game" src="about:blank"></iframe><aside><h1>Trailgloam — actual encounter</h1><p>Protected Scout storage. Position buttons are setup only. Observe and input buttons use the running game. Default camera, no replacement renderer.</p>
<select id="station"><option value="approach">Grove edge approach</option><option value="close">Near the resident</option><option value="away">Stream out</option></select><button id="position">Place player</button><button id="hide-dev">Hide developer panel</button><button id="read">Read encounter</button><button id="observe">Observe for 20 seconds</button><button id="hit">One ordinary tool swing</button><button id="walk">Walk toward resident for 1 second</button><button id="contact">Approach body for 1.5 seconds</button><button id="retreat">Walk backward for 3 seconds</button><pre id="receipt"></pre><pre id="trace"></pre></aside>
<script type="module">
import {identifyCompanion} from '../../../src/companions/companionCatalog.js';
const iframe=document.querySelector('#game'),$=s=>document.querySelector(s),get=()=>iframe.contentWindow.__game;
const packaged=new URLSearchParams(location.search).has('packaged');iframe.src=packaged?'/dist/submission/index.html?scout=1':'/?scout=1';
const find=()=>get().creatureSystem.getCreatures().find(c=>c.state.originId==='f1:w:-10:13:700');
const key=(type,k)=>iframe.contentWindow.dispatchEvent(new iframe.contentWindow.KeyboardEvent(type,{key:k,code:'Key'+k.toUpperCase(),bubbles:true}));
function position(){const g=get(),c=find(),st=$('#station').value;const p=st==='away'?{x:0,z:0}:st==='close'?{x:(c?.state.pos.x??-463),z:(c?.state.pos.z??685)-1.35}:{x:-463,z:678};g.characterPhysics.setPosition({x:p.x,y:g.frontierChunks.getHeight(p.x,p.z)+.7,z:p.z});g.playerController.syncPosFromPhysics();g.playerController.snapRenderPose();g.cameraFollow.orbitBy(Math.PI-g.cameraFollow.getYaw());g.cameraFollow.snap();read()}
function sample(){const g=get(),c=find(),p=g.playerController.getState();let a=null;if(c){const s=c.state,models=[];c.group.updateWorldMatrix(true,true);c.group.traverse(o=>{if(o.userData.externalModelInstance){const ctl=o.userData.modelAnimationController;models.push({path:o.userData.externalModelPath,clip:ctl?.activeState,timeScale:ctl?.active?.getEffectiveTimeScale(),clipTime:ctl?.active?.time,clipName:ctl?.active?.getClip()?.name,bounds:new g.THREE.Box3().setFromObject(o,true)})}});a={id:s.id,originId:s.originId,species:s.speciesTag,ai:s.aiState,hp:s.hp??s.health,dead:s.isDead,pos:{...s.pos},base:c.group.position.toArray(),home:s.homePos,cfg:{moveSpeed:c.cfg.moveSpeed,capsuleRadius:c.cfg.capsuleRadius,capsuleHalfHeight:c.cfg.capsuleHalfHeight},distanceHome:Math.hypot(s.pos.x-s.homePos.x,s.pos.z-s.homePos.z),terrain:g.frontierChunks.getHeight(s.pos.x,s.pos.z),groundGap:c.group.position.y-g.frontierChunks.getHeight(s.pos.x,s.pos.z),bondable:identifyCompanion(c),models};}return{ms:performance.now(),packaged,actor:a,player:{pos:{...p.pos},facing:p.facing,grounded:p.grounded,health:g.playerCombat.getHealth()},render:g.renderer.info.render,sourceIds:g.creatureSystem.getCreatures().map(c=>c.state.originId).filter(Boolean)}}
function read(){$('#receipt').textContent=JSON.stringify(sample(),null,2)}
let busy=false;async function trace(duration,k=null){if(busy)return;busy=true;const start=performance.now(),rows=[];const collect=()=>{const s=sample();rows.push({...s,ms:s.ms-start});};collect();const timer=setInterval(collect,100);if(k)key('keydown',k);try{await new Promise(r=>setTimeout(r,duration));}finally{if(k)key('keyup',k);clearInterval(timer);collect();$('#trace').textContent=JSON.stringify({input:k?'ordinary keyboard '+k:'observation only',rows},null,2);busy=false;read()}}
$('#position').onclick=position;$('#read').onclick=read;$('#observe').onclick=()=>trace(20000);$('#hit').onclick=()=>{trace(20000);key('keydown','f');setTimeout(()=>key('keyup','f'),90)};$('#walk').onclick=()=>trace(1000,'w');$('#retreat').onclick=()=>trace(3000,'s');$('#contact').onclick=()=>trace(1500,'w');$('#hide-dev').onclick=()=>{const panel=iframe.contentDocument.querySelector('#scout-controls');panel.hidden=!panel.hidden};
addEventListener('pagehide',()=>{for(const k of ['w','s','f'])key('keyup',k)});
</script></html>
