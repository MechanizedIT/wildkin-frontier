<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0e1420" />
    <title>Wildkin Frontier — Phase 2</title>
    <link rel="stylesheet" href="./styles/game.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "rapier": "./vendor/rapier.js",
          "@dimforge/rapier3d-compat": "./vendor/rapier.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app" aria-label="Game canvas container">
      <canvas id="c" aria-label="3D scene"></canvas>
      <div id="hud" aria-hidden="false">
        <div class="hud-top">
          <div class="badge">
            <strong>WILDKIN FRONTIER — Phase 2</strong>
            <small>Field Tool · Wood / Stone / Fiber</small>
          </div>
          <div class="badge" style="text-align: right">
            <strong style="font-size: 11px">Left: move · Right: swipe dodge</strong>
            <small>C=Sneak · Shift=Run · Space=dodge</small>
          </div>
        </div>
        <div class="hud-bottom">
          <div id="debug-label">Phase 2 — 0.5.0 · starting…</div>
          <div class="hud-hint">White ring = in harvest range · Approach to auto-harvest</div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
