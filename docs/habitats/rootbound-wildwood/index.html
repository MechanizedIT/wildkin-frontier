</style><header><div class="eyebrow">Wildkin Frontier · Habitat field guide</div><h1>Rootbound Wildwood</h1><span class="tag">Living draft · design and evidence kept separate</span><p>Five connected subhabitats, their ecology, regional materials and constituent designs. Explore the evolving references, reusable asset studies and actual model/gameplay evidence.</p></header><div class="layout"><nav aria-label="Dossier chapters"></nav><main id="content"></main></div><script>
const pages=[{"file":"DOSSIER.md","title":"Rootbound Wildwood — living dossier V1","body":"# Rootbound Wildwood — living dossier V1\n\n**Showcase direction:** prioritize a diverse, full, living Rootbound that rewards exploring, looking closely, harvesting and observing Wildkin. Use good-looking useful models even when they differ from a target. Review reusable parts, credible arrangement/scale/tint variants and useful bendable root/trunk authoring; judge actual placement and interaction. [Practical review direction](../../ROOTBOUND_ASSET_REUSE_REVIEW.md).\n\nRootbound is the current focus: a shaded, root-sculpted woodland built around readable clearings, low ridges, thornstone seams and a damp hollow. Its proposed Heartroot Crown landmark must not be confused with the player's retained earned grove. This dossier preserves the existing [packet](PACKET.md), source evidence and held trials; proposed content remains distinct from implemented gameplay.\n\n## Future illustrated field journal\n\nThese dossiers are also intended as a reusable source for player-facing habitat, Wildkin, material and discovery entries. Each should connect a strong illustration with identification cues, ecological relationships and useful observations. Keep player knowledge, discoverable secrets and production notes separate, with one traceable fact source. Read the [field-journal content contract](FIELD_JOURNAL_SOURCE.md) for the proposed entry structure and review requirements. No journal or discovery-unlock system is implemented by this documentation.\n\n[Showcase V1 status](SHOWCASE_V1.md) separates the playable milestone from dossier completeness.\n\n## Actual, retained foundation\n\nThe Grove now includes the retained log-and-fungi colony and a modest rear-right canopy corner. It still falls short of the sheltered target. Next is a whole-region placeholder blockout. [Actual comparison](../../../art/reviews/rootbound-wildwood/lantern-composition-r1/review.html).\n\nLatest implemented detail: the Lantern threshold now carries a modest irregular faceted ground surface through the actual terrain and collision mesh. Independent review retains it, the developer and packaged poses agree, and the scoped crossing/support checks pass. [Actual integrated ground comparison](../../../art/reviews/rootbound-wildwood/terrain-facets-r3/review.html). This is one local floor treatment, not completion of the five proposed rooms.\n\n![Actual integrated Rootbound floor in portrait gameplay](../../../art/reviews/rootbound-wildwood/terrain-facets-r3/integration/integrated-portrait.png)\n\nTrailgloam's retained TRELLIS model now has an independently reviewed fitted eight-leg animation diagnostic. It is still an asset candidate rather than a spawned encounter. [Actual translated motion and remaining work](../../../art/reviews/trailgloam-travel-r1/review.html).\n\n`src/world/frontierRootbound.js` owns a bounded Rootbound profile, clearing palette preservation, two ridge/clearing/hollow relief language, and curated fixed scenery. `frontierScenery.js` gates Rootbound curation to its profile/default world and retains protected identity sampling. Existing eligible visual roles are the admitted paddle/canopy, fallen-log, mushroom-ring, fen-stone and related low-kit families recorded in the packet/review receipts. The exact protected harvestables, wildlife homes, grove and route remain authoritative in the packet and current source.\n\nUse the [current spatial plan](SPATIAL_PLAN.md) for the five proposed subhabitat locations and route hypothesis. Original packet diagrams are preserved as history; current source and native captures remain implementation evidence.\n\n![Rootbound V2 technical map — proposed geography with actual source and camera overlays](../../../art/targets/rootbound-wildwood/layout-target-v2.svg)\n\n![Whole-region illustrated candidate V1 — reviewed art direction, not a literal runtime map](../../../art/targets/rootbound-wildwood/concepts/dossier-v2/whole-map-v1.png)\n\nThis first illustrated map explores ecological identity and massing. Its dramatic hollow walls and root crossings are not approved construction details. The technical map governs planned locations; neither map proves a walkable route.\n\n## Environmental direction — proposed, not simulated\n\nA cool-temperate, rain-fed woodland: approximately 10–19°C seasonal daytime design range, high canopy humidity, damp organic hollows, and drier exposed thornstone ribs. These are design cues for value zoning and ecology, not a weather, temperature, moisture, crafting, or save system.\n\n| Zone | Ground / climate cue | Existing role | Proposed ecological emphasis |\n|---|---|---|---|\n| Root ridge | drier, wind-exposed, darker roots | route edge / landmark | sparse thornstone and exposed fallen wood |\n| Open clearing | brighter leaf litter, usable floor | safe orientation | retained forage visibility and low clustered growth |\n| Lantern hollow | damp, shaded, enclosed | visual discovery room | fungi/rings and decomposing wood |\n| Thornstone seam | mineral-grey, broken slope | risk/readable edge | stones, low thorns, constrained passage |\n| Grove threshold | established vegetation | earned-home continuity | no identity or footprint change |\n\n## Constituent priorities\n\n1. **Root architecture and canopy mass** — visual gap remains; the held buttress-tree trials are historical, not admitted.\n2. **Hollow floor ecology** — mushroom, log and low-cover families should cluster by damp shelter rather than uniform scatter.\n3. **Thornstone seam** — use existing stone family only where full support and portrait framing prove it reads.\n4. **Named harvestable presentation** — future names/visual distinctions may map to existing wood/stone categories, but no runtime inventory type is proposed.\n5. **Wildkin niche** — preserve Mossling and its Bloom ability relationships; a Rootbound-native candidate needs a separate visual and gameplay review before admission.\n\nSee constituent dossiers for bounded families. No new asset, decor, harvestable, discoverable, Wildkin or system is accepted by this document.\n\n## Zone field guide\n\n### Root Galleries — implemented terrain language; proposed richer landmark read\nRoot Galleries are the drier, raised corridors between root ribs. Their walking floor should remain visibly broad while the sidewall rises in broken, low buttresses. The local microclimate is cool and intermittently sunlit: canopy gaps dry the leaf litter after rain, while root undersides retain dark humus. The player purpose is orientation—choose the quiet gallery for safe travel or follow the more crowded ridge edge toward stone and discovery. Existing relief and curated records establish this grammar; a future root-architecture asset would make the gallery silhouette legible beyond current low props.\n\n### Lantern Grove — proposed hollow ecology on implemented clearing palette\nLantern Grove is the humid basin: shade, decomposing wood, shallow moss colour and grouped fungi. It is not water or a new wetness mechanic. The floor stays traversable and visually lighter in its center so a player can read companions, forage and return direction under the HUD. Mushroom rings belong near log ends and root hollows; pale blooms occupy the transition from clearing to shade. This creates proposed vegetation shelter around a future creature pocket; Bloom is Mossling's ability, not a separate species or flower asset.\n\n### Thornstone Verge — implemented stone seam; proposed mineral story\nThe Verge is a grey-green, droughtier seam where shallow soil gives way to thornstone. It should read as a side-edge decision, not a wall: fragmented upright forms, exposed stone chips and low hardy cover frame an open travel lane. Stone harvest presentation can use a unique Rootbound visual/name while feeding the shared **stone** crafting category. The value is recognizability and route contrast, not a new mineral economy.\n\n### Heartroot Crown — proposed landmark and discovery anchor\nHeartroot Crown is a proposed old-root landmark, not the existing earned-grove threshold. Its intended character is sheltered canopy, stable leaf litter and fewer thornstone intrusions. A later discoverable can be a visual/root landmark or lore-facing observation; its location and relationship to existing content require spatial and gameplay review.\n\n## Climate and material gradient\n\n| Measure | Galleries | Lantern Grove | Verge | Crown |\n|---|---:|---:|---:|---:|\n| Day air (design range) | 12–18°C | 10–15°C | 13–19°C | 11–16°C |\n| Relative moisture cue | medium | high | low–medium | medium–high |\n| Light/value | broken mid-dark | diffuse dark | exposed mid | warm filtered mid |\n| Dominant material | weathered root/leaf litter | humus, log, fungi | thornstone, dry root | old root, settled litter |\n\nThese are composition references; the game has no temperature or moisture simulation.\n\n## Material and harvestable presentation\n\n| Provisional field name | Zone | Visual distinction | Shared category | State |\n|---|---|---|---|---|\n| Galleryfall wood | Galleries | pale split rootwood with dark bark seams | wood | proposed visual naming |\n| Lanterncap forage | Lantern Grove | clustered low luminous-cap silhouette, never a floating glow | food | proposed presentation |\n| Verge thornstone | Verge | grey-green angular shard with oxidized root marks | stone | proposed presentation |\n| Crownfiber | Crown edge | long muted gold-green strands at root base | fiber | proposed presentation |\n\nThe names are working labels, not accepted UI strings or new item IDs. Existing harvesting and its categories stay authoritative.\n\n## Ecology relationships\n\nRoot ribs create shade and a protected windbreak; fallen wood retains moisture; fungi group around that wood; thornstone interrupts soil depth and pushes low cover into seams; open clearings preserve forage visibility. Mossling movement needs supported open floor; its two current default-world source homes are in the retained eastern woodland, outside the proposed five-room circuit. Bloom is its companion ability. Pale flowers at sheltered clearing margins are a vegetation proposal, not a second species. Trailgloam is a native candidate with a retained eight-legged, paired-frond TRELLIS model and fitted movement diagnostic; gameplay admission remains pending; its possible niche is low-light root-hollow scouting, not replacing Mossling or creating a new encounter mechanic.\n\n## Player purpose\n\n**Composite harvestables:** Chris proposed independently harvestable tree parts, such as cutting a crossing root while the trunk and canopy remain. All harvested parts should regrow on much longer timers, with nearby structures suppressing regrowth for settled clearings. The [composite-harvestable dossier](constituents/composite-harvestables.md) connects this to modular art, saved partial state and safe regrowth. These are design directions, not implemented composite destruction or building suppression.\n\nExploration includes easy travel and optional places reached through current climbing or harvestable clearing. See [traversal and discovery intent](TRAVERSAL_INTENT.md). Difficult access can be intentional; an unavoidable trap is a defect. Broader decor destruction and emergency evacuation remain future proposals.\n\nA Rootbound visit should offer a readable safe gallery, a richer hollow edge, a thornstone-side choice, and a clear return cue at the Crown. Harvestables remain familiar crafting inputs; the habitat adds visual reason and spatial memory. Discoverables should reward looking at a landmark, not demand a new quest, inventory field or interaction rule.\n\n## Reference and production backlog\n\nThe [V2 spatial plan](SPATIAL_PLAN.md) and [visual reference plan](VISUAL_REFERENCE_PLAN.md) guide the map and subhabitat targets. Existing review captures under `art/reviews/rootbound-wildwood/` are actual gameplay evidence. The connected buttress-root now has a reviewed reference and an exported raw geometry master, independently scored 7.2/10 for bounded Blender cleanup; see its [illustrated source/target card](constituents/root-architecture.md). It is not admitted in game. Broader Rootbound tree/wood, mineral, forage and discovery families need developed reference dossiers. Trailgloam has earlier construction references to assess and reuse. Each constituent proceeds through separate target, independent review and bounded production stages; this dossier does not imply asset admission.\n\n## Five connected subhabitats\n\n### Orientation Meadow\n**Implemented:** the retained clearing palette and existing ordinary ecology. **Proposed:** a bright, low-relief entry meadow with short grass/leaf-litter scale, medium moisture, scattered Crownfiber margins and an uninterrupted safe route. The open floor could suit a future Mossling encounter, while pale flowers frame the gallery ecotone; no present Meadow resident is asserted. Its landmark is a visible dark rootline ahead, its discoverable purpose is orientation, and it transitions into Galleries through increasing root exposure rather than a hard border.\n\n### Root Galleries\nDry-to-medium ribs rise one to three metres at room edges, with broken warm light and Galleryfall wood. Safe travel follows the broad inner gallery; a richer side route follows root pockets toward thornstone. The landmark is a connected buttress/root silhouette. The selected [buttress-root target](../../../art/targets/rootbound-wildwood/constituents/buttress-root/selected.png) is a reference direction, not admitted geometry.\n\n### Lantern Grove\nA humid, low, dark hollow transitions from Galleries through fallen wood and thicker shade. Lanterncap forage/fungi group at log/root contact; Proposed pale flowers belong at the lighter outer margin. Its safe line remains a dry center; the riskier edge is visually denser and can host a future Trailgloam niche. The landmark is a low lantern-cap/log cluster, never a magical light source.\n\n### Thornstone Verge\nThis is the exposed, lower-moisture seam: grey-green shards, short hardy growth and sharper side relief. Verge thornstone is a proposed stone-category presentation. The safe route stays on the clearing-facing edge; a risk/reward route samples the seam without closing travel. A broken thornstone line is the landmark and transition from root humus to shallow mineral soil.\n\n### Heartroot Crown\n**Proposed zone, relationship unproven:** a sheltered old-root landmark with warm filtered light, deep litter and stable moisture. It is not asserted to be the retained earned grove; any overlap must be verified in source/route evidence. Its purpose is a future visual discoverable and return landmark, with proposed open creature-friendly margins and no new progression mechanics. It transitions from Galleries via denser root collar and fewer thornstone intrusions.\n\n## Visual references\n\nSee the new [five illustrated subhabitat references](SCENE_REFERENCES.md), with independent artistic/practical review and an implementation brief. Camera mismatch and asset gaps remain explicit; these are provisional scene references rather than gameplay proof.\n\nThe selected portrait direction remains [the Rootbound target](../../../art/targets/rootbound-wildwood/concepts/selected.png); layout and composition references remain linked above. The buttress target supplies the desired connected low-root silhouette. Owner-provided references are preserved under the Rootbound target/review history and guide palette/massing only; native captures remain the implementation authority.\n\n![Generated Rootbound portrait direction — not gameplay evidence](../../../art/targets/rootbound-wildwood/concepts/selected.png)\n\n![Selected buttress-root design reference — model generation under review](../../../art/targets/rootbound-wildwood/constituents/buttress-root/selected.png)\n\n## Constituent dossier index\n\nThese are initial working cards, not yet complete production dossiers. Expand them after the current TRELLIS tests and workflow review.\n\n| Constituent | Working dossier |\n| --- | --- |\n| Orientation Meadow | [Subhabitat card](constituents/orientation-meadow.md) |\n| Root architecture | [Buttress roots and trunk anchors](constituents/root-architecture.md) |\n| Rootbound wood and trees | [Regional wood family](constituents/rootbound-wood-tree.md) |\n| Thornstone and minerals | [Stone family](constituents/thornstone-mineral.md) |\n| Forage and fungi | [Lantern Grove forage family](constituents/forage-fungus.md) |\n| Wildkin | [Verified distribution, Mossling and Trailgloam dossiers](constituents/wildkin.md) |\n| Heartroot Crown | [Landmark and discovery card](constituents/heartroot-crown.md) |\n\n[TRELLIS experiment history](../../TRELLIS_EXPERIMENT_LEDGER.md) records successful Mossling settings and the current root trial. [Focused goal](../../ROOTBOUND_FOCUSED_GOAL.md) records the active scope, source-quality priority and working six-attempt allowance.\n"},{"file":"SHOWCASE_V1.md","title":"Rootbound showcase V1 - delivery status","body":"# Rootbound showcase V1 - delivery status\n\nThis is the root orchestrator's working delivery definition, not a completion claim. Chris has paused asset experiments: use placeholders/existing assets to establish the whole region, TRELLIS for complex missing assets when needed, and refinement later.\n\n| V1 outcome | Current evidence | Remaining work |\n| --- | --- | --- |\n| Five different connected rooms | Technical map and whole-region/subhabitat targets | Assemble Meadow, Galleries, Grove, Verge and Crown |\n| Terrain, ecology and landmarks | Local faceted floor and a retained Grove corner | Broad room-scale masses, dense margins, openings, Heartroot landmark |\n| Satisfying 3-5 minute circuit | Historical route work and current movement/harvesting | Play the assembled route with gathering, side discovery and return cues |\n| Visible Wildkin life | Existing Mossling; retained Trailgloam model, rig and native travel | Appropriate encounters and required behavior/motion integration |\n| Regional materials/discoveries | Illustrated constituent dossiers and current resource families | Put useful visuals/interactions along the circuit; composite destruction remains proposed |\n| Usable local build | Latest checkpoint passes tests/verification/package | Final outing, relevant save/streaming and portrait play; illustrated owner handoff |\n\nAssembly takes priority. Use broad placeholders to establish shape and feel; do not delay the whole region for a polished prop. A complex missing asset can use TRELLIS when needed, with refinement deferred.\n\nRoot previously offered a rough 2-3 additional focused overnight sessions, with low confidence until an assembled room demonstrates the pace. This is not a delivery promise or measured percentage. The experiment-heavy pace did not support a dependable ETA; update it from completed rooms and integrated work.\n\n[Living dossier](DOSSIER.md) / [Actual Grove](../../../art/reviews/rootbound-wildwood/lantern-composition-r1/review.html) / [Actual Trailgloam travel](../../../art/reviews/trailgloam-travel-r1/review.html)\n"},{"file":"SCENE_REFERENCES.md","title":"Five illustrated subhabitats","body":"# Five illustrated subhabitats\n\nFive generated V1 illustrations supply provisional art direction. Independent review found useful ecological grouping, connected forms and palettes, but **none is an exact native-camera acceptance target**: the player sits lower than in the current game and framing remains cinematic. New southern Galleries and east Verge also need native comparison poses. [Independent review](../../../art/targets/rootbound-wildwood/concepts/dossier-v2/scene-reference-review.md) · [Implementation brief](../../../art/targets/rootbound-wildwood/concepts/dossier-v2/implementation-brief.md).\n\n## Orientation Meadow\n\n![Orientation Meadow — generated scene reference V1](../../../art/targets/rootbound-wildwood/concepts/dossier-v2/orientation-meadow-v1.png)\n\nRetain broad quiet ground, clustered edge growth and a nearby rootline cue. Keep a genuinely open meadow; avoid applying the same corridor treatment everywhere. Background openings are design suggestions, not proven passages.\n\n## Root Galleries\n\n![Root Galleries — generated scene reference V1](../../../art/targets/rootbound-wildwood/concepts/dossier-v2/root-galleries-v1.png)\n\nRetain the connected bent/tapered buttress, grounded log and sheltered fungi. This proposes a southern extension beyond the recorded ridge area. The defining roots need a separate construction target and reviewed model; optional climb/clear pockets should use actual eligible interactions.\n\n## Lantern Grove\n\n![Lantern Grove — generated scene reference V1](../../../art/targets/rootbound-wildwood/concepts/dossier-v2/lantern-grove-v1.png)\n\nRetain grounded log/fungus contacts and quiet interaction floor. Review calls for stronger humid/shaded identity and smaller cap scale; this version remains too bright and open for the final Grove treatment.\n\n## Thornstone Verge\n\n![Thornstone Verge — generated scene reference V1](../../../art/targets/rootbound-wildwood/concepts/dossier-v2/thornstone-verge-v1.png)\n\nRetain the clear exit and broken side cluster. Mineral identity remains weak: generic boulders and wood dominate. Develop a distinctive shard-family reference. The proposed eastern location comes from the technical map, not this illustration.\n\n## Heartroot Crown\n\n![Heartroot Crown — generated scene reference V1](../../../art/targets/rootbound-wildwood/concepts/dossier-v2/heartroot-crown-v1.png)\n\nRetain warm rootwood, leaf litter and the quiet approach. The huge hollow arch is an aspirational separate landmark asset, not the current buttress target or a proven passage. [Composite harvestables](constituents/composite-harvestables.md) could let selected roots be cleared while the landmark persists, with slow regrowth and building suppression per owner direction; these behaviors are not yet implemented.\n\n## From reference to construction\n\nPrioritize the connected root asset and a measured local placement. Reuse admitted logs/fungi where they visually fit; create targeted missing mineral and landmark forms. Each brief needs dimensions, tool-aware construction, asset/system matches, deferred aspirations and comparison poses. Preserve detailed masters and review simpler runtime derivatives separately. Exact prompts are saved beside the images. Actual model renders and ordinary gameplay provide implementation evidence.\n\n## Owner-selected ground treatment\n\n![Owner supplied ground reference showing shallow low-poly folds and planar facets](../../../art/targets/rootbound-wildwood/concepts/dossier-v2/terrain-owner-reference.jpg)\n\nChris highlighted the softly crinkled, faceted ground rather than perfectly flat expanses. The desired treatment combines shallow geometric undulations with readable planar shading and restrained color variation. Keep broad walkable areas comfortable; increase broken relief toward roots and mineral seams. Truly flat areas remain appropriate when deliberate. Do not equate painted triangular color patches with verified geometric relief. [Scoped terrain assessment](TERRAIN_FACETS_PLAN.md) identifies the current owners and next practical step; no terrain change is implied by this reference.\n"},{"file":"SPATIAL_PLAN.md","title":"Rootbound Wildwood — spatial plan V2","body":"# Rootbound Wildwood — spatial plan V2\n\n## Scope and coordinate basis\n\nThis is a reviewable composition plan for the retained local circuit. It does not alter `PACKET.md`, protected footprints, source identity, or runtime. The retained camera stations are **Arrival (-475,590)**, **Gallery (-480,720)**, and **Destination (-449,675)**. Current source markers are the Crown proxy **(-468,717)**, hollow **(-445,678)**, and the existing ridge language. The proposed Orientation Meadow is therefore revised to the retained Arrival floor, centered **(-475,590)**, rather than an unproven (-405,610) relocation.\n\n## Zone plan\n\n| Zone | Bounds / status | Terrain & ecology | Player role / camera |\n|---|---|---|---|\n| Orientation Meadow | x[-500,-455], z[570,615]; retained arrival floor | low bright clearing, sparse edge cover | safe start, arrival looks mostly east toward a proposed nearby rootline |\n| Root Galleries | x[-500,-455], z[615,705]; proposed southern extension, actual ridge evidence near z717 | dry root ribs, Galleryfall wood edge | primary lane, foreground side buttress / mid open route; new comparison pose needed |\n| Lantern Grove | x[-465,-430], z[660,690]; hollow marker retained, composition proposed | damp log/fungi edge, dry central negative space | fixed destination primary room |\n| Thornstone Verge | x[-430,-405], z[675,710]; proposed east relocation, existing thorn feature overlaps hollow at(-447,679) | drier shard edge, low hardy patches | optional east branch and richer visual risk; new comparison pose needed |\n| Heartroot Crown | x[-485,-450], z[705,735]; Crown proxy current, zone role proposed | sheltered old-root mass, warmer litter | historical Gallery camera is at proposed Crown threshold; not equated with earned grove |\n\n## Map and ordered route\n\nThe [technical map](../../../art/targets/rootbound-wildwood/layout-target-v2.svg) uses exact world X/Z projection, 25m grid spacing and current source overlays. The [portrait study](../../../art/targets/rootbound-wildwood/composition-target-v2.svg) is a separate camera-class composition reference. [Independent review](spatial-plan-review.md) approves bounded scene-reference authoring; runtime feasibility remains held.\n\nThe proposed primary centerline is **298.244 m**, not a walking-time result. Its ordered points are:\n\n`(-475,590) → (-478,613) → (-480,643) → (-472,663) → (-449,675) → (-452,696) → (-480,720) → (-493,701) → (-495,673) → (-494,646) → (-492,615) → (-475,590)`.\n\nThe optional mineral branch is `(-449,675) → (-427,680) → (-415,694) → (-430,711) → (-452,696)`, rejoining before Crown. Proposed visual lane widths are4–6m primary and3–4m optional, subject to actual player/companion/camera clearance. No path, resource move or danger rating is admitted by this drawing.\n\n## Journey hypothesis\n\nLatest [exploration steering](TRAVERSAL_INTENT.md) allows optional climbing and harvestable-clearing pockets. This centerline describes a main route hypothesis, not a demand for walkability everywhere. Focus proof on the actual main outing, intentional climb/clear transitions, critical interactions and traps; do not run exhaustive ordinary-walk validation for each art edit. The broad decor-destruction and emergency-escape ideas are future proposals.\n\nThe historical local trace is the evidence baseline; it is not restated as a new timing result. This plan hypothesizes a 3–5 minute outing only after a measured ordinary loop: Arrival → Galleries → Lantern Grove → Crown → Meadow, with optional Verge branch. Interactions and the branch must supply duration; no idle laps. Required proof: actual 2m/player-footprint route, all source/home parity, asset hull/support, ordinary walk, persistence, and matching captures.\n\n## Sightline and height hierarchy\n\nRecorded A/Arrival yaw-1.743, C/Destination yaw-2.3, and B/historicalGallery yaw-1.36 all use36° downward portrait pitch,52° verticalFOV and11.591m effective distance. Forward is `(-sin(yaw),-cos(yaw))`; Arrival looks mostly east. The small native player is near mid-height and the ground fills the scene. Preserve that framing rather than copying a cinematic horizon. New southern Galleries and east Verge need frozen native poses before matching-pose target selection or implementation acceptance; earlier scene illustrations may use the same camera class with that limitation explicit.\n\nMeadow foreground stays empty; a 1–2m root/ridge edge is mid-frame. Galleries use one 3–5m connected root anchor at the side, never across lane. Grove uses low 0.3–1m fungi/log clusters on edge and a 4–8m dry center. Verge is 1–3m fragmented thornstone, leaving an escape sightline. Crown is the rare 4–6m silhouette. Existing relief is shown separately from proposed strengthening in the map.\n\n## Asset matrix\n\n| Role | Existing / gap | Priority | Proof |\n|---|---|---|---|\n| low logs/rings/thornstone | existing admitted kit | P1 | full bounds, projection, support |\n| connected buttress root | target exists; not admitted | P1 gap | reference review, asset loop, hull/camera |\n| Rootbound wood visual | proposed presentation | P2 | no item/schema change |\n| Lanterncap cluster | existing kit may suffice | P2 | grounded cluster projection |\n| Trailgloam | separate proposed species lane | P3 | anatomy/gameplay/habitat review |\n\n## Ecotones\n\nMeadow→Galleries: brighter litter to root shade. Galleries→Grove: dry rib to fallen wood/humus. Grove→Verge: humus to mineral seam. Crown is a sheltered branch of Galleries, not a claimed existing grove. These gradients are visual/ecological direction; no climate simulation is proposed.\n\nUse irregular overlapping margins rather than hard boundaries. Outbound and west-return views should reveal different faces of shared anchors. The map plots35current life-preservation points, three stable-plate areas, three ridge polylines, hollow and thorn extents and recorded cameras; it is not a survey of every obstacle or home footprint. Final-triangle support, source/home/resource continuity, complete asset hulls, ordinary gathering and travel, streaming and exact reload remain open. Current mask algorithms do not automatically lock all terrain heights, but their supported-life outcomes must remain proven.\n"},{"file":"TRAVERSAL_INTENT.md","title":"Exploration through climbing and clearing","body":"# Exploration through climbing and clearing\n\nOwner steering, September14: Rootbound should include easy paths and places that require effort to enter. The player has climbing and can destroy harvestables; universal ordinary-walk reachability is not the habitat goal. Chris can playtest exploration and raised the possibility of later broad decor destruction and a cooldown emergency evacuation. Those two systems are proposals, not current implementation requests.\n\n## Current capabilities\n\n`src/movement/climbProbe.js` admits suitable active traversal faces with ledges1.2–4m above the feet, direct approach, adequate top support and a capsule-clear exit. `climbingController.js` handles climb, hold, descend, mantle and detach, including invalid or blocked situations. This foundation does not establish arbitrary tall-wall or all-decor climbing.\n\nSolid harvestables lose their colliders on complete depletion through the existing resource lifecycle, with later respawn behavior. Verify the actual selected resource's identity and lifecycle when a route depends on clearing it; do not assume every decorative log, stone or tree is harvestable. Ordinary scenery has no universal damage/depletion system. There is no general cooldown evacuation action.\n\n## Rootbound planning adjustment\n\n- Keep a readable ordinary main outing and a return route. It need not be a conspicuous paved corridor through every room.\n- Label optional pockets by access intent: ordinary movement, eligible climb, existing harvestable clearing, or proposed future capability. A slope that fails an ordinary walking check is not automatically a rejected design.\n- Explore one or two local climb/clear discoveries with distinct visual cues and a plausible return. Do not require a broad destruction or evacuation system to make the current habitat playable.\n- Do not use imagined future escape to excuse an actual inescapable hole. Optional difficulty and an unintended softlock are different outcomes.\n\n## Focused proof instead of exhaustive accessibility\n\nSpend effort on the main outing, essential interactions, intentionally used climb/clear transitions and suspected traps. Repeat checks when related geometry or behavior changes; avoid rerunning a habitat-wide walking search for every decorative or reference-image revision.\n\nFor a climb-dependent pocket, check a reachable eligible face, supported clear mantle, descent/return and blocked-exit behavior. For a clearing-dependent entrance, use the actual harvestable and confirm visual/collider removal, reentry and persistence/respawn behavior. For a suspected hole, establish a real escape or reject that trap. Preserve required shared-system and aggregate checks at runtime checkpoints.\n\nChris's playtesting should judge route discovery, effort, fun and perceptual readability. Supply concise player-facing instructions describing the landmark, action and visible failure signs. Agent checks still cover deterministic failures that should not consume human playtesting time. No claim of complete terrain reachability is required.\n\n## Future proposals\n\nBroad decor destruction could begin with stable-ID removal or damaged-state swaps, bounded brief debris effects and streamed persistence, rather than permanent dynamic rubble. Assess destructible-instance counts, batching, collider removal, save growth, respawn and landmark continuity on an actual device before calling it affordable. Ground terrain itself is a separate scope.\n\nA possible emergency evacuation would return the player to a nearby validated supported clear point with cooldown. It needs its own design for destination validity, inventory/health preservation, combat use, companion handling and reload behavior. No cooldown duration, penalties, UI or implementation is approved here. It would provide recovery, not replace basic prevention of unavoidable traps.\n"},{"file":"TERRAIN_FACETS_PLAN.md","title":"Rootbound terrain facets — bounded next-pass plan","body":"# Rootbound terrain facets — bounded next-pass plan\r\n\r\n## Actual first comparison\r\n\r\n[Matched native portrait comparison](../../../art/reviews/rootbound-wildwood/terrain-facets-r1/review.html): root tested a visible 16×18m render-only patch at .18m and .35m amplitude after independent review corrected the original support/camera calculation. Both preserved the existing triangle count. The gentle result is difficult to distinguish; the stronger version adds only faint floor planes and needs support reconciliation before gameplay use. No terrain source changed. This answers the first perception experiment, not the full terrain direction. Next design should combine deliberately irregular planes and restrained surface color; adding low-amplitude sine waves alone is insufficient.\r\n\r\n## What the current render actually does\r\n\r\nThe retained [final destination capture](../../../art/reviews/rootbound-wildwood/final-destination.png) already shows broad triangles in the open floor, but they are too even to give the Lantern Hollow threshold a clear, shallow ground rhythm. The committed [terrain direction](../../../art/targets/rootbound-wildwood/concepts/dossier-v2/terrain-owner-reference.jpg) is useful for its restraint: a calm walkable center, irregular large planes, and relief held at roots and stones. It is a visual direction, not a measured terrain specification.\r\n\r\nThe present terrain mesh is already low-poly in the relevant render path. `FRONTIER_TERRAIN_CONFIG` creates ordinary 50 m chunks with 25 segments (2 m cells), and both the ground material at `frontierChunkRuntime.js:247` and the separated cliff material at `frontierChunkRuntime.js:68` set `flatShading: true`. The stored vertex normals are therefore not smoothing this material into the current appearance. Flat shading derives its lighting from triangle faces; actual vertex heights, triangle layout, baked ground texture, and scene lighting determine whether those faces read.\r\n\r\n`sampleFrontierRootboundFeature(x, z)` and `sampleFrontierRootboundProfile(x, z, { baseHeight, habitatWeight, protectDefaultLife })` are the existing Rootbound exports. The latter already makes its macro displacement preservation-aware. There is no current microfacet option or separate normal API; this plan does not assume either.\r\n\r\n## One bounded geometry study\r\n\r\n**Candidate area:** the outer Lantern Hollow threshold at `x [-460, -450]`, `z [682, 690]`, within ordinary chunk `(-9, 13)`. This is the rear/left edge of the fixed destination room, deliberately outside its central player lane and away from the curated lantern log, rings, and thornstones around `z 678–681`. It is one connected 10 × 8 m patch, not three screenshot-only chunks and not a global detail setting.\r\n\r\nThe next structural pass should evaluate one actual-height alternative on the **existing 2 m mesh**:\r\n\r\n| Element | Existing render | Candidate geometry | Limit |\r\n| --- | --- | --- | --- |\r\n| Grid and shading | 2 m cells, flat-shaded | unchanged | no automatic 1 m subdivision or chunk-wide cost increase |\r\n| Height language | macro hollow/bank only | one coordinated, deterministic shallow undulation across the 10 × 8 m edge patch | at most ±0.10 m from the retained profile; 5–8 m directional wavelength, no per-vertex random noise |\r\n| Boundary | ordinary neighboring terrain | zero-height fade across the patch’s outer 2 m | no seam or abrupt new ledge |\r\n| Life and props | current protected footprint and curated support | no displacement in any protected point/plate, resource/home support, curated solid-hull support, or certified lane sample | no identity, transform, or admission change |\r\n\r\nThe useful comparison is **baseline 2 m flat-shaded mesh versus this same 2 m flat-shaded mesh with modest coordinated height relief**, captured at the fixed destination pose. That keeps the visible planes broad and gives flat shading something real to light. A shallow diagonal swale plus one offset shoulder is preferable to a periodic checkerboard: it should lead into the existing lantern bank rather than compete with it.\r\n\r\nIf the height study remains visually too quiet, an optional *correlated normal* presentation experiment can be reviewed separately. It can change only rendered lighting; it does not change collision or support. It must not be represented as physical ground detail, must use the same low-frequency direction as an accepted height form, and should remain subtle cosmetic faceting; reject strong false ledges or gaps that mislead navigation, not ordinary shallow lighting illusions. Random independent normals are not the recommended first implementation because the material is already flat-shaded and such a treatment could mislead navigation without improving the actual terrain.\r\n\r\n## Existing ownership and implementation boundary\r\n\r\nA source pass, if independently approved, belongs in the existing Rootbound numeric profile and terrain-query chain rather than in a shader-only overlay. The new local term would be computed after the active Rootbound feature is known and multiplied by the existing preservation result. It must remain neutral for alternate worlds exactly as the current Rootbound profile does. No new exported sampler is required or proposed.\r\n\r\nFor this patch, `createFrontierChunk`, `sampleFrontier`, and `sampleFrontierHeight` must resolve the same final triangles used for rendering and play. The current detailed-triangle seam is Skybreak-specific; this plan does **not** claim that Rootbound can reuse it unchanged. A concrete implementation must first choose a bounded, reviewed way for query and mesh to agree, without recursive ecology sampling or a render-only height path.\r\n\r\nBefore a source freeze, prove all of the following against the retained default-world baseline:\r\n\r\n1. The full existing Rootbound resource footprints, wildlife home disks, curated scenery hull supports, and their IDs/transforms retain their contract. The existing three stable resident plates and four-metre feather remain intact.\r\n2. The destination lane plus its `.32 m` player-footprint sampling stays physically supported on the final 2 m triangles. The unmodified corridor remains the reference; no narrowing or relaxed slope threshold is allowed.\r\n3. Default implicit and explicit worlds agree; alternate worlds remain Rootbound-neutral.\r\n4. The destination frame shows a readable low, broad face change without a new focal obstacle. Gallery and arrival are comparison-only captures, not additional terrain scopes.\r\n\r\n## Decision rule\r\n\r\nProceed only when the single patch produces visible, calm low-poly ground variation at the destination and all support/identity checks pass. HOLD if the existing 2 m triangles make the effect look like noise, if the form is hidden behind the room’s props, or if preservation removes all useful area. In that case retain the current geometry and evaluate the limited correlated-normal presentation option honestly; do not expand to a 1 m mesh, add a global terrain rule, or alter another Rootbound room.\r\n## Relationship to the full showcase\r\n\r\nThis patch is the first comparison for choosing a useful terrain treatment, not a reduction of the owner's Rootbound-wide objective. If it produces a readable improvement, extend the same language deliberately across the habitat with different strength by subregion and intentional quiet/flat exceptions. Keep the main outing, ecological density and Wildkin work moving alongside terrain refinement.\r\n"},{"file":"FIELD_JOURNAL_SOURCE.md","title":"Rootbound dossiers as a future field-journal source","body":"# Rootbound dossiers as a future field-journal source\n\nOwner direction, September 14: the habitat and constituent dossiers should also supply illustrated player-facing knowledge, including individual Wildkin entries. This is a content-authoring contract; no journal system or unlock mechanic is implemented here.\n\n## One fact source, several presentations\n\nKeep a stable identity for each habitat, subhabitat, species, material and discovery. Link entries by those identities. Separate the observed or designed fact from its player-facing wording so a future journal, tooltip and production brief do not develop contradictory copies. Existing runtime IDs must be verified before mapping a dossier entry to them; proposed names are not save IDs.\n\nProvisional authoring keys use `rootbound.\u003ckind>.\u003cslug>`, for example `rootbound.subhabitat.root-galleries`. Record content status (`proposed`, `implemented`, `verified`), audience state (`draft`, `designer-only`, `player-ready`), and evidence links separately. These are document metadata, not a new runtime schema. Each practical player claim needs a concrete source or gameplay receipt before becoming player-ready; a linked portrait capture supports visual identification, not unseen behavior. Keep secret details in the designer-only appendix and publish only the intended discovery layer.\n\nEach dossier should include:\n\n| Content | Purpose |\n| --- | --- |\n| Identity and status | Stable dossier key, display-name candidate, habitat/parent links, proposed versus implemented status |\n| Illustrated field entry | Short evocative description, recognizable silhouette, scale reference, habitat and visible identification cues |\n| Practical observations | Where it occurs, what it does, relevant resource uses or creature behavior, grounded in verified gameplay when presented as player advice |\n| Ecological relationships | Climate/moisture design cues, subhabitat distribution, food/shelter associations and linked constituents |\n| Discovery layers | Ordinary knowledge, information intended to be learned through observation, and designer-only secrets; unlock conditions remain proposals |\n| Production appendix | Dimensions, modeling plan, asset paths, camera poses, collision/streaming costs, source evidence and review findings |\n| Visual provenance | Image role, source/prompt, review status, revision, and whether it depicts a concept or actual game content |\n\n## Publication boundary\n\nA compelling concept is not automatically true in the game. Player-facing claims about taming, danger, drops, crafting equivalence or discovery rewards need a matching implemented rule and evidence before publication. Climate descriptions can establish fictional setting without implying a temperature simulation. Keep unimplemented mechanics and technical review scores out of player prose.\n\nKeep high-resolution source illustrations and editable text. Derive smaller journal images later; preserve an accessible text description and useful silhouette at small display size. Species construction sheets, scenic targets and journal illustrations serve different purposes and should be explicitly labeled rather than treating one image as suitable for everything.\n\n## Rootbound example — proposed field prose\n\n**Root Galleries:** “Broad roots gather into sheltered passages beneath the woodland. Look for openings in the root walls: brighter ground marks the clearing edges, while fallen wood and small fungi gather in the shade.”\n\nThis is draft environmental prose, not a claim that the retained game already delivers every cue. Once the composition is implemented, verify those cues in ordinary portrait play before promoting the entry to player-ready content. Avoid revealing hidden discoveries in the ordinary habitat description.\n\n## Review responsibilities\n\nAn independent design reviewer checks coherent geography, ecology and useful player knowledge. An art reviewer checks identity, composition and visual consistency. A modeling reviewer checks dimensions, connections, bends/taper, materials and a practical construction route. Runtime review then confirms that player-facing statements match actual behavior. These are review perspectives assigned to agents, not claims of human professional credentials.\n\nApprove content and implementation separately. A well-written dossier can be ready for production while its journal entry remains unpublished and its asset remains a candidate.\n"},{"file":"VISUAL_REFERENCE_PLAN.md","title":"Rootbound Wildwood — visual reference plan","body":"# Rootbound Wildwood — visual reference plan\r\n\r\n**Status: first six-image reference set generated and independently reviewed.** See [scene references](SCENE_REFERENCES.md) and the image-folder reviews. The technical map has conditional concept-authoring approval; the illustrations are useful provisional scene/mood references with documented camera and identity weaknesses. They do not prove terrain, access, gameplay, persistence or current implementation. Exact submitted prompts, including generation-time additions, are preserved beside each output.\n\r\n## Direction\r\n\r\nRootbound is a rain-fed, root-sculpted woodland that moves from a bright orientation floor through dry raised root ribs and a humid log-and-fungus pocket to a mineral side seam, ending on a warm sheltered old-root landmark. The visual rhythm is **reveal → enclosure → choice → reveal**. It uses four scale bands: leaf litter and sprouts; fungi/reeds/low cover; connected roots, logs, and thornstone clusters; then one low but memorable Crown silhouette. Keep open floor intentional: a substantial pale, dry walking lane stays readable through the center rather than becoming a hedge maze.\r\n\r\nUse restrained low-poly mobile materials: faceted opaque rootwood in warm red-brown, dark teal-green shade masses, humus/leaf-litter floor, concentrated violet/magenta/pale-cyan fungal accents, and grey-green thornstone. Do not use photoreal bark, dense vine curtains, magical fog, emissive neon, water, buildings, bridges, or a copied generic fantasy forest.\r\n\r\n## Grounding and calibration\r\n\r\nSource references for the later target-author call:\r\n\r\n| Need | Required evidence |\r\n|---|---|\r\n| Current player-scale portrait framing | `art/reviews/rootbound-wildwood/restart-baseline-{arrival,gallery,destination}.png` and matching `restart-r2-*` frames, all 412×915. Preserve the visible player in the lower central play band at the same approximate scale; reserve the upper-left objective/minimap and lower-corner control zones as negative space. Do not paint a replacement HUD. |\r\n| Fixed comparison poses | Arrival player `(-475, 590)`, yaw `-1.743`; Gallery `(-480, 720)`, yaw `-1.36`; Destination `(-449, 675)`, yaw `-2.30`; pitch `0.6283185307`, effective distance `11.5910795442`. The 1100×900 overhead capture is a map/composition reference only, never a portrait acceptance frame. |\r\n| Revised map sequence | `docs/habitats/rootbound-wildwood/SPATIAL_PLAN.md`: Meadow `x[-500,-455], z[570,615]`; proposed Galleries `x[-500,-455], z[615,705]`; Grove `x[-465,-430], z[660,690]`; proposed east Verge `x[-430,-405], z[675,710]`; proposed Crown `x[-485,-450], z[705,735]`. The map is overhead planning scale, not a gameplay-camera template. |\r\n| Existing design direction | `docs/habitats/rootbound-wildwood/DOSSIER.md`, `PACKET.md`, `art/targets/rootbound-wildwood/{layout-target-v2.svg,composition-target-v2.svg,concepts/selected.png}`, and the reviewed buttress-root constituent target. |\r\n\r\nThe whole-map illustration is an overhead planning-scale view, explicitly different from gameplay; it may show labeled **art-direction zones** for discussion, but it must not expose route masks, source IDs, home disks, save IDs, coordinate grids, collision shapes, performance counts, or other player-irrelevant metadata. Keep that technical material in a separate planning overlay/manifest. Portrait prompts use player-facing place names only; their technical pose and scale constraints belong in the generation record, not painted labels.\r\n\r\n## Six exact prompts\r\n\r\nAll prompt outputs are provisional reference candidates requiring independent visual selection and feasibility review. Supply the listed source images as visual references when the generator supports them. Do not merge source screenshots into a collage or treat a generated map as recovered geography.\r\n\r\n### 1. Whole-map illustrated direction\r\n\r\n**Sources:** revised spatial plan; 1100×900 `restart-baseline-overhead.png`; layout and composition SVGs.\r\n**Format:** one clean wide illustrated map, about 16:9, no HUD and no gameplay camera claim.\r\n\r\n> Illustrated top-down art-direction map for **Rootbound Wildwood**, a compact rain-fed alien woodland, rendered as a clean low-poly game-world planning illustration. Show one coherent continuous landscape sequence from a bright open **Orientation Meadow** through a proposed southern extension of dry **Root Galleries**, a small shaded humid **Lantern Grove** hollow, an east-side grey-green **Thornstone Verge** seam, and a warm sheltered **Heartroot Crown** threshold. The central route reads as broad pale leaf-litter floor with irregular clearings; roots and logs form low connected edges, never a maze. Establish four scales: tiny ground growth, low fungi/reeds, connected rootwood/log anchors and thornstone groups, one restrained old-root Crown silhouette. Rootwood is warm red-brown, gallery shade dark teal-green, fungi are concentrated violet/magenta with sparse pale cyan, thornstone is desaturated grey-green. Five small readable illustrated zone labels only; no coordinates, grids, technical overlays, HUD, buildings, bridges, rivers, glowing magic, giant castle tree, or dense uniform scatter. This is an art-direction map, not a literal level layout.\r\n\r\n### 2. Orientation Meadow portrait\r\n\r\n**Sources:** restart baseline/R2 Arrival portrait; revised Meadow zone.\r\n**Format:** portrait 412×915 native-gameplay composition: 36° downward pitch, 52° FOV, no cinematic horizon; player about 10% of image height centered near 56% image height. Retain the baseline camera/player scale.\r\n\r\n> Portrait mobile gameplay art direction for **Orientation Meadow** in Rootbound Wildwood, matched exactly to the supplied 412×915 restart-r2 arrival frame: 36° downward view, 52° FOV, no horizon, player about 10% image height centered near 56% height; retain upper-left and lower-corner UI-safe negative space without drawing a fake HUD. A bright pale leaf-litter clearing has a broad quiet walking lane, short low grass and sparse puff plants, with clustered fungi only at the edges. Ahead, a dark low connected rootline forms a clear return cue and begins the transition into shade; one side opening hints at a denser route. Use low-poly faceted opaque materials, warm muted floor, teal-green shade, very limited violet accents. No giant tree proxy, wall of vegetation, water, buildings, floating roots, or uniform prop scatter.\r\n\r\n### 3. Root Galleries portrait\r\n\r\n**Sources:** restart baseline/R2 Gallery portrait; reviewed buttress-root target; Root Galleries card.\r\n**Format:** portrait 412×915 native-gameplay composition: 36° downward pitch, 52° FOV, no cinematic horizon; player about 10% of image height centered near 56% image height. Retain the baseline camera/player scale.\r\n\r\n> Portrait mobile gameplay art direction for the **proposed southern Root Galleries extension** in Rootbound Wildwood, matched to the supplied native 36° downward / 52° FOV portrait camera and player scale; do not imply that the current Gallery station at the Crown threshold is evidence of this proposed room. Frame a broad pale inner floor lane with one substantial side buttress-root architecture: several bent, tapered roots join into a thick trunk collar, then break into low irregular ribs along the edge. The route stays visibly open for player and companion; a lighter wide line reads safe while a tighter root-pocket opening suggests a richer side choice. Add a grounded fallen log and sparse dry leaf litter near the root edge, dark teal-green canopy masses beyond, and small fungi only in protected shaded contacts. Low-poly opaque faceted rootwood, warm red-brown against cool shade. No detached root arcs, floating trunk parts, symmetrical tunnel, dense vines, glowing mushrooms, or impassable maze.\r\n\r\n### 4. Lantern Grove portrait\r\n\r\n**Sources:** restart baseline/R2 Destination portrait; selected Lantern Hollow/Thornstone direction; Grove card.\r\n**Format:** portrait 412×915 native-gameplay composition: 36° downward pitch, 52° FOV, no cinematic horizon; player about 10% of image height centered near 56% image height. Retain the baseline camera/player scale.\r\n\r\n> Portrait mobile gameplay art direction for **Lantern Grove**, matched to the supplied native destination camera: 36° downward pitch, 52° FOV, no horizon, lower-center player about 10% of frame height near 56% height. Show a small shaded humid hollow with a dry pale central interaction lane. On one sheltered edge, a single grounded fallen root-log joins the soil and carries a clustered family of broad low fungi at log ends and root contact; the fungi create one restrained violet and pale-cyan focal contrast, never neon. The far and side edges use dark teal-green shade and low humus, while a visible gap gives a return direction. The center remains clear and level-looking, with no water mechanics implied. Low-poly opaque faceted forms, no floating mushroom caps, magic lights, dense curtain foliage, shrine, building, or invented Wildkin interaction.\r\n\r\n### 5. Thornstone Verge portrait\r\n\r\n**Sources:** destination and gallery portraits; revised Verge side branch; current fen-stone references.\r\n**Format:** portrait 412×915 native-gameplay composition: 36° downward pitch, 52° FOV, no cinematic horizon; player about 10% of image height centered near 56% image height. Retain the baseline camera/player scale.\r\n\r\n> Portrait mobile gameplay art direction for **Thornstone Verge**, an east-side lateral choice off Rootbound’s gallery. Match the supplied native 36° downward / 52° FOV mobile camera, with no horizon and the player at the restart-r2 scale. A broad clearing-facing escape lane runs through the lower-middle frame; on one side, a broken low seam of grouped grey-green thornstone shards rises from shallow dry soil beside exposed warm roots. Keep the stone cluster irregular and readable as a geological family, with short hardy scrub and sparse leaf litter, while the opposite side opens back toward darker roots and a recognizable return cue. The composition should say optional mineral edge, never blockage. Restrained low-poly materials; no giant crystalline spires, cave, bridge, lava, water, aggressive creature, HUD, or evenly scattered spikes.\r\n\r\n### 6. Heartroot Crown portrait\r\n\r\n**Sources:** restart baseline/R2 Gallery portrait; Heartroot Crown card; reviewed root architecture reference.\r\n**Format:** portrait 412×915 native-gameplay composition: 36° downward pitch, 52° FOV, no cinematic horizon; player about 10% of image height centered near 56% image height. Retain the baseline camera/player scale.\r\n\r\n> Portrait mobile gameplay art direction for **Heartroot Crown**, the proposed warm sheltered threshold beyond the galleries, matched to the supplied native 36° downward / 52° FOV gallery portrait camera and restart-r2 player scale. The current Gallery station is at its threshold, not proof of a completed Crown room. A low memorable ancient root collar sits beyond an open leaf-litter floor: bent tapering buttresses merge continuously into a broad trunk base and sparse overhead wood silhouette, with warm filtered light on settled litter. Mossling-friendly open margins and a clear look-back gap preserve orientation; fungi stay subtle near damp root contacts and thornstone is largely absent. Keep the Crown impressive through connected silhouette and value contrast, not extreme height. Low-poly opaque faceted rootwood, no floating roots, hollow walk-under arch, giant canopy wall, magical altar, quest icon, HUD, or claim that this is the existing earned grove.\r\n\r\n## Constituent map and known gaps\r\n\r\n| Zone | Visual role | Existing evidence / usable family | Proposed reference priority or gap |\r\n|---|---|---|---|\r\n| Orientation Meadow | bright reset and rootline return cue | retained clearing palette, ordinary low ecology, Mossling/Bloom relationship | composition reference; no new mechanics or asset implied |\r\n| Root Galleries | proposed southern medium-density transition, connected low wall and route frame | curated canopy/log roles, existing low kit, bounded relief language | **connected root/buttress architecture** is the consequential silhouette gap; buttress target is reference only and current TRELLIS quality run held before raw export |\r\n| Lantern Grove | sheltered log/fungus destination | admitted fallen log, mushroom rings, pale floor direction | existing kit can express a small cluster; broad Lanterncap family remains a proposed later reference, not a glowing system |\r\n| Thornstone Verge | proposed east-side mineral choice and counterweight | existing fen-stone/thornstone family | composition needs grouped seam and full clearance/projection proof; no new mineral economy |\r\n| Heartroot Crown | warm root landmark and orientation cue | source Crown proxy/ridge area and existing roots/wood references | old-root collar/landmark is still a proposed separate constituent; it is not the earned grove |\n\r\n## Feasibility gate before any reference can become a build brief\r\n\r\n1. A root/trunk must be one connected opaque mass: each buttress joins a thick collar or trunk through full faces, with no intersecting closed solids, free-floating roots, paper-thin ribbons, or hollow walk-through arches.\r\n2. Bend/taper geometry must be legible: use sectioned tapered volumes with irregular but continuous centerlines, thicker base/root junctions, and a visibly grounded lower footprint. A broad canopy must not substitute for missing root structure.\r\n3. Every normal portrait candidate preserves the player, central lane, companion clearance, a return cue, and the UI-safe bands. Map beauty or overhead readability is insufficient.\r\n4. Runtime feasibility later requires real transformed bounds, support, collision hulls, source/home/route protection, terrain-footprint samples, camera projection, resident/streaming cost, and ordinary route/reload proof. These constraints must not be painted as player-facing labels.\r\n5. The target author, spatial planner, mesh builder, and independent reviewer retain separate roles. A generated reference cannot self-select or admit an asset.\r\n\r\n## Next gate\r\n\r\nThe first whole-map and five scene references are complete. Next use the independent implementation brief to produce targeted constituent assets and improve actual composition. Preserve useful V1 art direction, correct camera framing before selecting matching-pose targets, and freeze native positions for the new Galleries/Verge. Latest exploration direction allows intentional eligible climb/harvest-clear pockets; do not interpret every steep edge as a failed ordinary route. Broader composite harvesting, long regrowth and building suppression remain documented future implementation directions.\n"},{"file":"constituents/composite-harvestables.md","title":"Composite harvestables — partial clearing and persistent landmarks","body":"# Composite harvestables — partial clearing and persistent landmarks\n\n**Dossier key:** `rootbound.system.composite-harvestables`\n**Status:** proposed design; no runtime implementation.\n**Audience:** designer draft; player-facing claims await gameplay proof.\n\nChris proposed a large tree made of independently harvestable parts: destroy a root to open a passage while leaving the rest of the tree intact. Treat this as Rootbound's preferred candidate for localized environmental clearing rather than requiring every landmark to disappear as one resource node.\n\n## Player experience\n\nA substantial tree remains recognizable before and after gathering. One low root bars an interesting opening; bark wear, cuttable root scale and a harvest cue make the possible action legible. Cutting that root yields its own material and reveals a usable gap. The trunk, canopy and other roots persist. Harvesting fungi attached to the tree need not cut the root beneath them.\n\nThe illustration of Heartroot Crown suggests the visual opportunity, but its giant hollow arch is not an admitted asset. A first test could use one small root obstruction beside the main route, leaving the landmark and ordinary return intact.\n\n## Owner-proposed Lantern Log kit\n\nChris reviewed the images favorably and proposed modular scenery: author a log, mushroom clusters and moss as separate reusable models; assemble variations into one composite harvestable. As damage accumulates, individual parts break away and drop the corresponding mushrooms, moss or wood. This is a future gameplay direction, not an implemented damage/drop system. His favorable assessment is retained alongside the narrower technical holds; those holds do not invalidate useful component art.\n\nA single placed parent should own the interaction and damage progression, with stable child identities for the removable log, fungi and moss pieces. Placement variation should use deliberate attachment locations and checked scale/orientation; keep fungi rooted into wood and moss seated on the actual surface. Reuse strong parts from existing candidates after component-level review rather than requiring every variation to be generated as one mesh.\n\nProvisional implementation approach: authored break stages can remove a selected child, update its collision if any, and grant its own material exactly once. Break order, damage thresholds, yields, tools and whether players can target a specific part remain open. If support wood breaks, remaining attached pieces must be removed/dropped or moved to a deliberately grounded remnant; do not leave floating mushrooms or moss. Regrowth should restore valid support before its dependents, on long timers and subject to building suppression and safe occupancy checks. Exact dependency/regrowth behavior still needs a scoped implementation decision.\n\nThe future source kit needs an intact arrangement and damaged-stage targets, clean child boundaries/pivots, visible attachment guidance and at least a few visibly different arrangements. Keep one coherent harvesting interaction and save owner; this proposal does not require separate damage loops or simulated physics for each piece. [Lantern constituent study](forage-fungus.md) supplies the references and actual retained models.\n\n## Proposed parts\n\n| Part | Proposed interaction | Visible result |\n| --- | --- | --- |\n| Structural trunk and main collar | Stable landmark in the first trial | Preserves silhouette and orientation |\n| Selected low crossing root | Independently harvestable wood | Local gap with grounded cut stubs; matching blocker removed |\n| Fallen branch | Independently harvestable wood | Branch disappears or becomes a nonblocking remnant |\n| Attached fungus cluster | Separate forage harvest | Fungi removed while supporting tree remains |\n| Remaining roots and canopy | Preserved in the first trial | Tree does not disappear or leave floating canopy pieces |\n\nNot every visually similar part should secretly behave differently. Art and interaction feedback must communicate harvestability. Some major roots can remain structural; do not imply arbitrary tree collapse or full structural simulation.\n\n## Practical construction contract\n\nAuthor a coherent whole-tree target, then identify its meaningful removable sections in the modeling plan. Give those sections deliberate cut boundaries, pivots and grounded remaining stubs. A modular tree should still look organically connected before harvesting; random intersecting cylinders are not sufficient.\n\nEach removable part needs stable identity within the parent, its own harvest state and corresponding render/collision membership. Reuse the existing harvesting and persistence owners where practical rather than inventing a second damage loop. Removing a visual alone must not leave an invisible blocker; removing a collider alone must not leave apparently solid wood. Reentry/reload must reconstruct the same partial tree.\n\nKeep unchanged geometry efficiently grouped and avoid per-piece per-frame simulation. A candidate implementation could swap or remove a bounded number of parts and use brief pooled debris effects. This is a performance hypothesis to measure, not a claim that arbitrary numbers of destructible pieces are affordable.\n\n## Owner direction: slow regrowth and building suppression\n\n**Current implementation, checked September 14:** generated Frontier forage enters the resource system as `persistentFinite: true` (`src/world/frontierEcologyRuntime.js`), and that resource path currently skips regrowth. Older non-finite node types still include short 12–18 second defaults (`src/resources/resourceConfig.js`). The new owner direction supersedes both policies for future composite harvesting; changing a timer alone will not enable it. A scoped implementation must reconcile generated ecology, resource state, saved timing and building influence together. This dossier has not changed either runtime path.\n\nChris explicitly selected regrowth for **all harvested parts**, using much longer timers than the early project. Placed structures, such as foundations near resource nodes, should suppress regrowth so a settled area can remain clear. This supersedes the earlier permanent-root-clearing proposal. It does not mean every structural trunk or canopy part must become harvestable immediately.\n\nExact delays, qualifying structures and suppression distances are still to tune. Preserve harvested state and remaining regrowth timing through reentry/reload; an eventual implementation must use the authoritative time/state owners. Whether suppressed timers pause, elapse while blocked, or restart after removing a structure is an unresolved product detail, not an invented rule. Building influence should suppress regrowth, not implicitly destroy nearby intact objects.\n\nRegrowing barriers must not overlap or trap the player or companions, intersect structures, or silently eliminate their only return. A candidate implementation should defer unsafe regrowth and reevaluate through bounded checks, rather than force-spawning an obstruction. This remains an implementation proposal requiring its own proof. The existing short resource respawn policy is not assumed suitable for structural parts.\n\n## First useful proof, when separately scoped\n\nOne tree, one removable root section, one opening, and unchanged remaining geometry. Use ordinary harvesting to clear it, pass through and return, then unload/reload and verify the partially harvested tree and inventory. Check that the opened part's collider is gone, siblings remain, and any respawn behavior cannot trap the player. Confirm player/companion access and phone cost for that specific example rather than proving all terrain walkable.\n\n## Draft future field-journal wording\n\n“Some ancient roots can be cut without felling their tree. Look for younger growth across the openings beneath the trunk.”\n\nPublish only after the visual cue and cutting behavior exist. All harvested parts regrow slowly and structures suppress regrowth by owner direction; exact timing and spatial rules remain undecided. Resource yields, tools, discovery rewards and cooldown evacuation are still unspecified. See [exploration intent](../TRAVERSAL_INTENT.md) and [field-journal contract](../FIELD_JOURNAL_SOURCE.md).\n# Independent practical review\n\n**Verdict: PASS as a bounded design candidate; HOLD for runtime implementation.**\n\nThis is a useful Rootbound interaction pattern because it preserves a landmark while making one deliberate root passage responsive to harvesting. It must remain a composited landmark feature, not a general destructibility rule.\n\nEach parent landmark and removable part needs a stable hierarchical identity that survives recipe ordering and streaming. A cleared root's visual state, collider state, interaction state, and persisted depletion state must change together; re-entry must neither restore a blocker nor duplicate its reward. The residual trunk and every non-harvested part must retain their existing mesh and collision ownership.\n\nThe art contract needs a continuous intact silhouette, an intentional cut/separation seam, and grounded remaining stubs after clearing. Attached foliage or fungi cannot float after a root disappears; separately harvestable fungus remains an independent object and does not inherit root clearing.\n\nUpdated for subsequent owner direction: regrowth is required for all harvested parts, on long timers, with nearby qualifying structures suppressing it. It cannot overlap or strand the player or companion. A first trial must demonstrate saved harvested state, safe later regrowth and building suppression rather than silently substituting permanent clearing.\n\nKeep runtime cost bounded: static grouped geometry, a toggled or removed collider, and a small pooled debris effect if one is needed. Do not introduce per-piece physics. Streaming must not create duplicate colliders or restore stale root state.\n\n## Smallest responsible future trial\n\nUse one dedicated optional root obstacle outside the main lane, with one removable root and a normal wood reward. Keep its trunk, canopy, and other roots fixed. Before clearing, the root must visibly block a named optional gap; after an ordinary harvest, show the cut remnant, remove the matching collider, and prove player and companion passage plus return. Unload/reload/re-entry must retain the harvested state and award no duplicate resource. Separately prove safe delayed regrowth, qualifying-building suppression and the eventual rule for removing that building. Exact timer/radius tuning remains open.\n\n## Independent practical review — Lantern kit extension\n\n**PASS as an owner-proposed future kit direction; HOLD for implementation.** The proposal correctly treats reusable log, fungus, and moss as authored components assembled into a single parent-owned landmark. The dossier keeps the favorable visual feedback distinct from the held whole-object models and makes no false claim that semantic extraction, damage drops, harvesting, or placement exists.\n\nFor a future trial, one parent must own damage progression, save state, and regeneration scheduling; each removable child needs a stable identity, one reward path, and an explicit support dependency. Removing wood must either remove or deliberately ground any dependent fungus/moss before collision and visibility update together. Long-timer regrowth must restore support before dependents and defer if structures, players, companions, or return routes make restoration unsafe. The initial scope should be one fixed arrangement and one removable part, with variations only after persistence, support removal, and suppression behavior are proved.\n"},{"file":"constituents/ecology-wildkin-family.md","title":"Rootbound ecology and Wildkin constituents V1","body":"# Rootbound ecology and Wildkin constituents V1\n\n**Existing:** retained forage, Mossling/Bloom relationship, ordinary source identities and home footprints.\n\n**Proposed presentation:** named visual harvestable variants may remain in shared wood/stone crafting categories, with no new item schema. Damp hollow fungi, dry ridge wood and thornstone-edge material need source-safe visual differentiation before any names are promoted.\n\n**Wildkin:** a native candidate remains a separate reviewed lane. It may occupy root-hollow shelter/edge scouting space only after anatomy, gameplay and habitat support reviews; it does not replace existing Mossling/Bloom.\r\n"},{"file":"constituents/forage-fungus.md","title":"Lantern forage and fungus constituent","body":"# Lantern forage and fungus constituent\n\n**Dossier key:** `rootbound.flora.lanterncap`. **Asset study key:** `rootbound.asset.lantern-log`. **Status:** proposed regional presentation and new prop study; no new food, harvesting behavior or placement admitted.\n\n## Illustrated identification\n\n![Lantern log V2 selected structural target; generated art, not an implemented model](../../../../art/targets/rootbound-wildwood/constituents/lantern-log/reference-v2.png)\n\nV2 is the independently selected construction target: it preserves six attached caps and the bent log while simplifying bark and cap undersides into broad planes. The detail-rich V1 remains below as a source study. Neither image is proof of a usable model or game placement.\n\n![Lantern log V1 high-detail generated asset reference; not a model or gameplay screenshot](../../../../art/targets/rootbound-wildwood/constituents/lantern-log/reference-v1.png)\n\nDusty violet caps, stout pale stems and dark decaying rootwood identify the proposed Lanterncap colony. One broad mature cap anchors a group of smaller caps near the broken end, with a second group farther along the log. Moss gathers in damp creases rather than coating every surface. Keep bare wood between groups and an irregular age/scale hierarchy; avoid an evenly spaced ring pasted onto a log.\n\nThe [independent reference review](../../../../art/targets/rootbound-wildwood/constituents/lantern-log/reference-review.md) conditionally retains this as a high-detail source target. Dense bark flakes, gills and moss are source detail to simplify in a separate derivative. The left-end hollow is a shallow visual recess, not a promised tunnel or enterable cavity. Hidden depth and underside still require actual model inspection.\n\n## Draft field entry\n\n“In the cool shade, violet caps gather where old wood gives way. Look for pale stems near a fallen limb's broken end; the smallest caps often shelter beneath the oldest.”\n\nThis is proposed descriptive journal prose. It makes no claim that the current decorative mushrooms can be eaten or harvested. Publish practical gathering advice only after the corresponding interaction is implemented and verified.\n\n## Ecological relationships\n\n| Topic | Proposed direction | Practical effect |\n| --- | --- | --- |\n| Subhabitat | Lantern Grove, along the dry lip beside humid deadwood | Cluster beside the open interaction floor, rather than across it |\n| Climate cues | Approximately 10–15°C grove design range, shaded and relatively moist | Muted dark wood, violet caps and restrained olive moss; no weather simulation |\n| Growth pattern | Two irregular groups following damaged wood | Show mature, intermediate and young caps; preserve visible stem-to-wood contact |\n| Transition | Dry Galleryfall rootwood gives way to softer broken wood and cap clusters | The change should read through material and growth pattern, not a hard zone boundary |\n| Wildkin relationship | Trailgloam's proposed deadwood-edge foraging niche | One deliberate encounter setting if later admitted, not repeated residents at every log |\n| Neighboring flora | Low pale blooms at clearing margins; fiber strands at supported root bases | Keep the central floor quiet and readable |\n\nLanterncap is a proposed regional food-facing label, not a registered item or a recolored berry already admitted as food. A future common crafting/food category could preserve a distinctive local look and name, but the catalog, inventory, pickup and save contract must be decided together.\n\n## Current source evidence and reuse boundary\n\n`ROOTBOUND_CURATED_SCENERY` in `frontierRootbound.js` contains the existing decorative `lantern-log` at X−444/Z678 (asset_fallen_log, scale .95, yaw .45), plus `lantern-ring-a` at X−442/Z678 and `lantern-ring-b` at X−444/Z681 (asset_mushroom_ring, scales .9/.85). These are source records, not proof that every record is currently resident or supported in a loaded save. The shared scenery owner applies footprint guards and publishes runtime instances separately.\n\nThe existing log/ring assets remain unchanged. A new integrated log-colony candidate can supply planted cap attachments, a
