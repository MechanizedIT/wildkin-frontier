 deliberate broken-end silhouette and irregular clustered growth. It must first prove those advantages in actual renders. The current three source records are a possible bounded comparison site, not authorization to replace them blindly or to count this art study as an improved encounter.\n\nThe [executed source kit census](../../../../art/targets/rootbound-wildwood/constituents/lantern-log/existing-kit-census.json) measures 590 triangles in 27 mesh parts for the fallen log and 1,760 triangles in 30 parts for the mushroom ring. Their complete transformed envelopes are approximately 2.844 × 1.136 × 2.317m and 1.871 × 1.042 × 1.592m respectively (X/Y/Z, Y-up), including their surrounding details. Both source records have role `prop` and no authored collision descriptor. These facts do not prove harvesting or collision behavior of an eventual replacement. The proposed 1.6m log is deliberately smaller than the existing complete log envelope; preserve that scale difference for later player-view review rather than blindly reusing its placement scale.\n\n## Production contract\n\n![Actual manual Lantern Log R3 Blender render; held for further art work](../../../../art/source/lantern-log-v1/manual-r3/candidate-r3/renders/principal-threequarter-512.png)\n\nThe first manual candidate is an actual editable model, with 22 individually closed components, 1,452 triangles and a complete 1.622 × .561 × .825m envelope (Blender Z-up). Sixteen final log triangles supply .342m² of ground contact; all six local stem/log and cap-underside checks pass. Seven actual views at 512/96/48px are retained. [Independent R3 visual review](../../../../art/source/lantern-log-v1/manual-r3/visual-review.md) scores it **5.7/10, HOLD for art/runtime**: the cap colony reads, but the straight bark strips and regular recessed end resemble manufactured wood. That review guided the focused repair below. No current decorative record was replaced.\n\n![Actual manual R4 wood repair, retained partial gain but not admitted to gameplay](../../../../art/source/lantern-log-v1/manual-r4/candidate-r4/renders/r4-principal-threequarter-512.png)\n\nR4 removes the raised strips, cuts four broad grooves, breaks the end outlines and corrects palette conversion while preserving all twelve stem/cap meshes exactly. The actual repair has 16 components / 1,390 triangles and .355m² of grounded log surface. Forty-two matched R3/R4 images make the change directly assessable. [Independent R4 review](../../../../art/source/lantern-log-v1/manual-r4/visual-review.md) retains it at **6.3/10, still HOLD for art/runtime**: color and end detail improve, but the thin extruded body and blade-like far tip still miss the target's fuller wood mass. Stop repeating this five-section/rim method. The [proposed raw TRELLIS follow-through](../../../../art/source/lantern-log-v1/geometry-ply-proposal.md) led to the separately reviewed R5 raw-geometry run below.\n\nTwo guarded full-export TRELLIS attempts are held before export: [V1 evidence](../../../../art/source/lantern-log-v1/quality512-r1/run-receipt.md) records 6,755,672 decoded faces; [V2 evidence](../../../../art/source/lantern-log-v1/quality512-r2/run-receipt.md) records 2,218,798, still above the unchanged 750,000-face limit. This paired observation does not isolate a single cause or prove that simpler references always reduce geometry. No raw GLB resulted. The [illustrated asset study](../../../../art/source/lantern-log-v1/review.html) retains both targets and terminal evidence. Those are historical full-export failures. R5 uses a separately reviewed geometry-only output contract, not an unchanged retry or a textured-export cap increase.\n\n![Actual raw TRELLIS Lantern R5, untextured and held for further work](../../../../art/source/lantern-log-v1/geometry-ply-r5/inspection/three-quarter-512.png)\n\nR5 completed one fresh input-pinned geometry-only TRELLIS run and exact Blender inspection: 1,077,634 vertices / 2,218,798 triangles; a 41,776,379-byte untouched PLY and 21 neutral views. The model has fuller irregular wood but detached pieces and an incomplete-looking underside. [Independent raw review](../../../../art/source/lantern-log-v1/geometry-ply-r5/visual-review.md) scores the untextured material 4.4/10 and retains it as a source study, with cleanup/runtime HOLD. The [CPU topology audit](../../../../art/source/lantern-log-v1/geometry-ply-r5/topology-audit.md) confirms 67,425 boundary edges and 99,060 nonmanifold edges, so a measured reconstruction plan is needed before a derivative. Keep R4 too; raw and colored scores are not directly comparable. No texture, normalization, game placement or harvest behavior was added. [Actual R5 gallery](../../../../art/source/lantern-log-v1/review.html#raw-r5).\n\nThe original image prompt proposed a log about 1.6m long and .42m thick, with a mature cap about .42m wide. The subsequent measured manual plan deliberately uses a .5m mature cap and approximately .825m complete grounded height. These are design choices, not recovered image measurements or a claim about the final mesh. Report its actual complete envelope and review apparent scale beside the actual player before placement. Do not stretch it independently on axes to force every starting dimension.\n\nJudge the defining bent log, broken end, planted cap stems and unequal cap hierarchy at full, 96px and 48px sizes. Use actual side/rear/underside views to check unseen contacts and the shallow recess. Preserve a high-detail master, then simplify geometry/materials in a separate derivative with matching cameras. Never hide an absent attachment under a fabricated glow. Keep ground support and collision based on the complete actual envelope, with no invisible collider filling an apparent playable passage.\n\n## Future harvesting and regrowth\n\nThe [composite-harvestable direction](composite-harvestables.md) permits a future fungus group to be harvested separately from supporting wood. An initial static TRELLIS mesh does not automatically provide that separation. A later modular preparation needs stable part boundaries, persistent harvested state and corresponding visual/collision changes before claiming selective gathering.\n\nAll harvested parts should regrow on long timers, and qualifying nearby structures suppress regrowth by owner direction. Exact timers, influence distance and behavior after removing structures remain undecided. Safe regrowth must not intersect or trap players, companions or buildings. None of those behaviors is implemented by this reference or model study.\n\n## Latest actual reconstruction — R6 closes HOLD\n\n![Actual R6 neutral reconstruction with incomplete lower log volume](../../../../art/source/lantern-log-v1/cleanup-r6/diagnostic/renders/r6-three-quarter-512.png)\n\nOne reviewed voxel reconstruction closes the raw mesh surfaces but fails the single-component gate: 124,172 triangles in 240 surface components. A read-only diagnostic retains 42 matching R5/R6 views and exact unchanged-source proof. Actual images show major lower-log volume loss and small fragments. Preserve the raw master, manual R4 and this partial topology gain; no asset is admitted and no seventh Lantern repair belongs to this visit. [Matched illustrated comparison](../../../../art/source/lantern-log-v1/review.html#cleanup-r6) and [independent review](../../../../art/source/lantern-log-v1/cleanup-r6/terminal-visual-review.md).\n\n## Owner direction: a reusable log, fungus and moss kit\n\nChris's image review found useful visual quality and proposed separating this asset into reusable log, mushroom and moss models. Deliberately kitbash them into varied scenery, then present each arrangement as one composite harvestable: successive damage breaks off parts and drops their respective mushrooms, moss and wood. This makes component-level reuse an appropriate next direction; the held whole-object scores do not discard the useful pieces or override the owner's positive observation.\n\nThe retained manual R4 already has separate mushroom geometry; the raw TRELLIS source must not be assumed to have semantic log/mushroom/moss segmentation. Inspect and select components before reuse. A future kit needs stable part identities, checked surface attachments, intact/broken-stage targets, support-aware removal and long regrowth with nearby structure suppression. Damage thresholds, order, yields and targeting remain open. No kit variation, damage-drop behavior or semantic extraction has been implemented by this note. [Composite harvesting contract](composite-harvestables.md).\n\n[Current modular reuse assessment](../../../../art/source/lantern-log-v1/modular-kit-assessment.md) identifies six retained R4 stem/cap pairs and three surface-fitted moss patches. The retained wood remains a provisional component candidate with visible thin-body debt; review it at intended size before demanding a replacement. Use attractive useful pieces even when the whole earlier model scored below its target.\n"},{"file":"constituents/heartroot-crown.md","title":"Heartroot Crown and discoverable constituent","body":"# Heartroot Crown and discoverable constituent\r\n\r\nHeartroot Crown is a proposed old-root landmark zone; its relationship to the retained earned grove is unverified. Its proposed discoverable role is a visual/lore-facing root landmark that reinforces return orientation. The Crown must preserve all existing identities, forage, wildlife and grove continuity.\r\n\r\nThe existing scenic reference is aspirational. A feasible asset target should focus on a warm sheltered root-collar silhouette at normal portrait scale. It does not authorize a quest, progression gate, collectible schema, or new interaction mechanic.\r\n"},{"file":"constituents/mossling.md","title":"Mossling — the familiar woodland grazer","body":"# Mossling — the familiar woodland grazer\n\n**Dossier key:** `rootbound.species.mossling`. **Existing species ID:** `mossling`. **Visual ID:** `asset_wildkin_mossling`. **Status:** existing game species; Rootbound-specific composition remains proposed. **Audience:** field-entry draft with separate production evidence.\n\n## Illustrated identification\n\n![Mossling neutral design reference; generated art, not an actual game capture](../../../../art/targets/mossling-neutral-v3/reference.png)\n\nMossling's cream face and body, tall green leaf mane, white flowers, large ears and four planted feet make it readable against dark rootwood. Preserve the recognizable face and leaf silhouette when making smaller journal or gameplay images. Its appearance should not become a generic green quadruped.\n\n## Draft field entry\n\n“A small garden travels with the Mossling. Leaves shelter its shoulders, and pale flowers nestle among them. It watches before it approaches. Give it room, and the woodland feels a little less empty.”\n\nThis is proposed journal prose. The illustration is a design reference; it does not prove current animation or Rootbound encounter staging.\n\n## Source-backed observations\n\nThe current companion catalog calls Mossling a cautious forest grazer and names its ability **Bloom**, described as restoring two health and awakening living root seals. The catalog's displayed habitat text still names the earlier Verdant Verge location; do not silently replace that runtime wording with Rootbound in a player-facing entry. The ordinary field-taming guide uses berries, stepping back while it feeds, then approaching gently.\n\nThe [Rootbound source census](../../../../art/reviews/rootbound-wildwood/dossier-ecology/census.json) records two default-world Mossling homes: approximately X−416/Z740 and X−380/Z686, in the retained eastern woodland. Both source recipes are SKITTISH, with 4.4m roam and 8.5m leash radii. These are source settings, not a current loaded-resident or player-save count. They have not been moved into the new Meadow or Crown proposal.\n\n## Rootbound ecology proposal\n\nMossling belongs visually on the edge of a broad supported clearing, where its feet and face remain visible and a retreat direction is easy to read. Keep tall roots behind or beside it, not across its ordinary movement disk. Medium-moisture leaf litter and sparse forage connect this pocket to the woodland; berry feeding is supported by the existing bond guide, while any detailed wild diet or flower symbiosis remains lore design.\n\nA future Meadow encounter would need a separately admitted home and measured resident cost. Until then, the eastern homes are the actual Rootbound distribution. No population simulation, preferred-temperature mechanic, breeding dependency or new Camp requirement is implied.\n\n## Player knowledge layers\n\n| Layer | Content | Publication condition |\n| --- | --- | --- |\n| Identification | Cream body, green mane, white flowers, large ears | Compare with the actual current rendered model |\n| Observation | Cautious approach and retreat; berry bonding guide | Confirm the ordinary encounter before journal publication |\n| Companion knowledge | Bloom's catalog description | Verify the relevant present ability behavior; keep secrets out of the basic identification entry |\n| Designer-only | Rootbound source IDs/home coordinates and proposed scene placement | Never expose implementation IDs or claim a new discovery location |\n\n## Production evidence and open checks\n\n![Actual retained Mossling V3 neutral render; current model, earlier capture](../../../../art/source/mossling-v3/dossier-evidence/actual-v3-idle-three-quarter.png)\n\n![Retained actual V3 gameplay in Verdant Verge; not Rootbound encounter proof](../../../../art/source/mossling-v3/dossier-evidence/retained-v3-verdant-gameplay.png)\n\nThese are retained actual V3 images, distinct from the generated identification reference above. A fresh factory/file check confirms that the game still loads `assets/models/mossling-v3/model.glb`, matching the V3 asset record. The gameplay image shows an earlier Verdant Verge scene and its camera/HUD; it is not a fresh capture of Rootbound, a proposed Meadow resident, or current full-game acceptance. [Image provenance](../../../../art/source/mossling-v3/dossier-evidence/README.md) preserves that distinction.\n\nLater V4 eye-overlay experiments did not replace V3. Their visible-iris mapping remained incorrect, producing extra or floating eye fans. Preserve the current face, body, texture, rig and clips; any resumed eye work first needs a camera-aligned surface/UV diagnostic and independent evidence that it improves the actual eyes. Rootbound encounter composition does not depend on that optional experiment.\n\nThe preserved [Mossling V3 asset record](../../../../art/source/mossling-v3/asset.json) documents a 19,999-triangle, one-material, 1K-texture model with 23 bones and five clips. Its existing source is an editable Blender file and the model is already part of the game. The record explicitly leaves continuous motion and owner phone acceptance pending; structural asset checks do not close those perceptual gates.\n\nUse the [existing reference review](../../../../art/targets/mossling-neutral-v3/reference-review.md), model provenance and actual runtime factory when revising this species. Preserve the liked texture, face, flowers and existing capture/ability roles. Rootbound composition work should first expose the current creature clearly rather than rebuild it without a diagnosed problem.\n\nSources: `src/companions/companionCatalog.js`, `src/world/frontierWildlife.js`, the linked deterministic census and asset record. No species implementation changed here.\n"},{"file":"constituents/orientation-meadow.md","title":"Orientation Meadow constituent","body":"# Orientation Meadow constituent\n\nThe Orientation Meadow is the safe visual reset between Rootbound rooms: bright clearing palette, low scale, medium moisture and an open Mossling-readable floor. Existing source supports its clearing identity; named meadow forage and a rootline return landmark are proposed presentation work. It transitions gradually into Root Galleries through exposed roots and shade, without a hard biome boundary.\r\n"},{"file":"constituents/root-architecture.md","title":"Root architecture — Rootbound constituent brief","body":"# Root architecture — Rootbound constituent brief\r\n\r\n## Key and current state\r\n\r\n**Dossier key:** `rootbound.asset.buttress-root`. **Constituent:** Root Galleries buttress-root anchor. **Scene role:** a connected root web that gives the Galleries a memorable side silhouette, frames a readable floor, and offers a future optional traversal/clear-access question under [Traversal intent](../TRAVERSAL_INTENT.md). It must not turn the main outing into a mandatory climb test.\n\r\nThe selected direction is the [buttress-root selected V2 target](../../../../art/targets/rootbound-wildwood/constituents/buttress-root/selected.png). It is an image reference, not recovered orthographic geometry. The first quality 512 run held before export. A separately reviewed geometry-only run now has a verified raw PLY and exact Blender import: **raw fit 7.2/10, GO for cleanup; no textured GLB or runtime admission**. Prior studies and useful parts remain archived evidence; reuse requires current fit, topology, contact, and visual review.\n\n![Selected image reference; not implemented geometry](../../../../art/targets/rootbound-wildwood/constituents/buttress-root/selected.png)\n\n![Actual raw TRELLIS geometry in Blender; untextured and not in game](../../../../art/source/rootbound-buttress-trellis/geometry-ply-v1/raw-inspection/three-quarter.png)\n\nThe actual master contains 514,489 vertices and 1,029,792 triangles. The independent [raw geometry review](../trellis-geometry-visual-review.md) retains its useful curved trunk, fork and broad roots, while identifying root cadence, tip cleanup and a clearer bend as improvement opportunities. White inspection lighting obscures fine surface judgment. Preserve this high-detail master while comparing a separately prepared derivative under clearer matching lighting.\n\nThe first Blender derivative now has 154,468 triangles with nearly unchanged dimensions. A uniform five-metre root spread gives approximately 3.917m height; this preserves generated proportions rather than stretching to the design envelope below. Independent review retains the derivative as preparation evidence but holds art/runtime admission pending stronger broad-root grouping and fork character. The saved file contains one face-bearing mesh component plus 98 unused vertices to remove before export. [Compare actual raw and derivative views](../../../../art/source/rootbound-buttress-trellis/geometry-ply-v1/review.html). Materials, segmentation, collision and in-game fit remain open.\n\n![Actual Blender derivative in inspection clay; not final materials or gameplay](../../../../art/source/rootbound-buttress-trellis/geometry-ply-v1/cleanup-r1/renders/derivative/threequarter-512.png)\n\r\n## Design envelope\n\n### Structural R2 — actual partial improvement\n\nThe separately planned and independently reviewed R2 broadens the two camera-near root webs and adds a restrained middle-trunk bend. Its [matching actual Blender comparison](../../../../art/source/rootbound-buttress-trellis/geometry-ply-v1/structural-r2/review.html) receives **6.6/10, HOLD for art/runtime; retain useful partial improvement**. The model still reads as many narrow root struts rather than the target's four broad plates, and the upper fork remains unchanged. More material polish or stronger versions of the same displacement are not the next repair: a future attempt needs reviewed structural reconstruction, while another Rootbound constituent can advance.\n\n![Actual structural R2 Blender render; untextured, not gameplay](../../../../art/source/rootbound-buttress-trellis/geometry-ply-v1/structural-r2/renders/derivative/threequarter-512.png)\n\nThe high-detail derivative retains 514,489 vertices and 1,029,792 triangles; it is 24,756,512 bytes. Exact triangle indices and Z values are preserved. The actual float32 indexed surface audit finds zero collapsed triangles and zero nonpositive raw-to-edited normal dots; this does not certify global intersections or manifoldness. Maximum root displacement is 0.1432m and trunk displacement 0.0652m. Raw master and earlier reduction remain available. This is one counted structural repair, with no runtime or composite-harvesting admission.\n\r\nThe provisional design envelope is approximately4.5m tall,5m root spread and1.5m trunk-base width. These are intended construction dimensions, not measurements recovered from perspective. The readable structure is four broad grounded root directions, a continuous fused collar, one thick curved trunk and two fork stubs. The selected target is explicitly canopy-free. Valleys between the roots should remain legible; a hollow walk-through arch is not required by this target.\n\r\nEach foot descends with a visible outer curve and a concave valley into the collar. Trunk taper is gradual at the lower third, then faster after forks; branch bends occur as recognizable elbows/arcs, not straight pipes. Ground contact must look loaded into the soil at each foot, with no floating canopy or detached roots.\r\n\r\n## Future modular boundary plan\r\n\r\nNo current TRELLIS mesh is asserted to be segmented. If admitted later, a production build may separate: root-web/base, trunk-and-fork core, canopy/wood masses, harvest-removable outer wood pieces, and non-harvestable structural remnant. Boundaries must follow natural collars or branch unions so removal does not expose arbitrary cuts. Composite harvesting is an owner-accepted slow-regrowth and building-suppression design direction; production still needs a separate current contract before runtime work.\r\n\r\n## Kit and gap\r\n\r\nExisting Rootbound low kit can support logs, fungi and thornstone edges. It does not supply a demonstrated matching buttress silhouette. The current TRELLIS trial is the new-asset attempt for that gap. Judge its actual geometry before choosing cleanup, reuse of earlier useful pieces or a changed method; preserve the original master.\n\r\n## Player draft journal\r\n\r\n“Beyond the bright meadow, the old roots gather into low galleries. Their feet grip the ground like knuckles, leaving a sheltered way through the middle. The biggest crown is a landmark, not a promise of treasure.”\r\n\r\n## Production notes and next gate\r\n\r\nKeep the primary lane readable. Optional climb/clear access requires only current natural-climb eligibility and no-trap/essential-interaction proof, not universal walk reachability. The next review must inspect actual neutral model views, connected root/trunk contacts, silhouette at Rootbound portrait scale, triangle/material cost, collider/support fit, and whether the candidate remains HOLD or is admissible for a bounded habitat placement.\r\n"},{"file":"constituents/rootbound-wood-tree.md","title":"Rootbound wood and tree constituent","body":"# Rootbound wood and tree constituent\n\nGalleryfall wood is a **proposed visual label** for existing wood-category harvest presentation: pale split grain, dark bark seams and short curved root offcuts. A broad Rootbound tree differs from a generic canopy through a heavy low collar and irregular forked crown. It is an asset gap until a reviewed reference and admission prove otherwise.\n\nThe tree should mark a gallery edge or Crown approach, preserve the open player lane, and never silently alter wood drops or crafting.\r\n"},{"file":"constituents/structural-family.md","title":"Rootbound structural constituents V1","body":"# Rootbound structural constituents V1\n\n**Existing:** terrain profile, curated low scenery, retained grove and route contracts in the packet.\n\n**Proposed family:** one future root/buttress anchor, one damp hollow cluster and one thornstone seam. Each must be camera-projected, supported, reviewed and admitted independently; no substitute from held tree trials.\n\n**Gap:** existing low kit cannot alone supply a broad connected root-canopy landmark at portrait scale. The prior tree studies are HOLD evidence, not reusable runtime geometry.\r\n"},{"file":"constituents/thornstone-mineral.md","title":"Thornstone — fractured stone at the woodland edge","body":"# Thornstone — fractured stone at the woodland edge\n\n**Dossier key:** `rootbound.material.thornstone`. **Status:** proposed local mineral identity and generated design target; no unique model, item or harvesting behavior admitted. **Audience:** production dossier with clearly marked future field-entry prose.\n\n## Visual target\n\n![Generated Thornstone V1: unequal fractured slabs sharing a grounded bedrock foot](../../../../art/targets/rootbound-wildwood/constituents/thornstone/reference-v1.png)\n\nThree unequal stone teeth share a wide broken bedrock foot: one leaning stepped wedge, one shorter offset tooth and a low split plate. Broad desaturated gray faces carry olive stains and sparse warm root-shaped mineral scars. The scars are surface coloration, not living roots or magical veins. The V1 image is a detailed source study; its realistic fine texture exceeds the current game's simplified materials. Independent review retains its useful silhouette for a measured construction plan with deliberately simplified materials. A second generated style target is optional, not a gate.\n\nThe proposed envelope is roughly 1.6m wide × 1.1m deep × 1.45m high, a design choice rather than a recovered measurement. Its broad accessible lower face should read as a possible work surface. A later production plan must inspect all sides and build a grounded substantial volume; a single generated view does not specify hidden back faces or fracture depth.\n\n[Exact prompt and source notes](../../../../art/targets/rootbound-wildwood/constituents/thornstone/prompt-v1.md) · [Independent reference review](../../../../art/targets/rootbound-wildwood/constituents/thornstone/reference-review.md).\n\n## Habitat relationship\n\n| Topic | Intended expression | Current limit |\n| --- | --- | --- |\n| Home | Thornstone Verge, the drier eastern Rootbound seam | Proposed x[-430,-405], z[675,710] in the spatial plan; not an admitted relocation |\n| Climate | Approximately 13–19°C daytime design range, lower moisture than Lantern Grove | Narrative/ecology cues only; no temperature or wetness simulation |\n| Arrangement | Unequal clusters on exposed side slopes and root-eroded soil, with quieter gaps between them | Avoid evenly spaced identical cones and continuous stone walls |\n| Transition | Mineral faces become more exposed as damp wood/fungal cover thins | Keep separate visual reasons for Grove and Verge |\n| Wildlife | Optional mineral edges may frame observation space | No exclusive Wildkin resident, spawn or mineral-dependent ability specified |\n| Exploration | An optional side seam with visible return/open escape space | Current climbing eligibility and actual collision decide accessible surfaces; the target is not traversal proof |\n\n## Shared material, local identity\n\nThornstone is a proposed Rootbound presentation of the existing **stone** resource category. Its different name and shape should help players remember where they gathered it while remaining compatible with recipes that already consume stone. This dossier does not create a new mineral economy, special tool requirement, rare drop or recipe. The exact player-facing name remains provisional.\n\nCurrent `RESOURCE_TYPES.rock` is named Rock Outcrop, yields `stone`, is solid, and uses existing harvesting/drop feedback. The curated Rootbound `thorn-a` and `thorn-b` scenery instead use shared `asset_fen_stone` near the present hollow. Those decorative records are not automatically rock resource nodes. A visual replacement must not silently claim harvestability or change neighboring habitats that use the same shared asset.\n\n## Production and physical brief\n\nFive defining features worth implementing are the asymmetrical height hierarchy, broken angled crowns, broad stepped shoulders, substantial connected foot, and restrained gray/olive/rust material separation. Edge chips support those larger forms; they are not the primary silhouette. Avoid transparent gaps that a solid convex collider would falsely block, needle-thin peaks, separate hovering flakes, evenly repeated prisms and emissive crystal styling.\n\nA clean isolated object like V1 can inform a later TRELLIS input study, but it has not been independently certified as a generation input. A Blender route would use measured irregular closed wedge sections with deliberate steps and fractures, rather than stretching identical cones. Choose that method only through a tool-informed plan and independent review. Preserve a detailed master; review a separate simpler runtime derivative using matched views.\n\nExisting scenery batching, resource state and collision owners remain authoritative. A static decorative version and a harvestable version have different admission needs; selecting a pretty shape does not decide either contract. Any new collider must fit the actual model and its local scale, preserve the relevant route opening and unload with its source. No map relocation or collider is implemented here.\n\n## Damage, regrowth and building influence\n\nThe owner-proposed composite harvesting system could later support stone chunks breaking off while yielding ordinary stone. Whether Thornstone uses those stages or an initial whole-node harvest remains undecided. If staged, child shapes need stable identities, readable break boundaries, one reward owner and safe support-aware remnants. Damage thresholds, yield amounts and fracture order are not specified.\n\nAll harvested parts should regrow slowly, with qualifying nearby structures suppressing regrowth. Exact timers, distances and the policy after structure removal remain open. Generated Frontier forage currently uses finite persistent depletion; the older non-finite rock default is 17 seconds. Neither current behavior is the intended final long-regrowth design. See [composite harvesting](composite-harvestables.md) for the shared future state and safety requirements.\n\n## Draft field-journal entry\n\n“Where the roots loosen their grip, Thornstone shoulders through the dry soil. Its gray-green faces split along old scars. Fresh breaks reveal the darker stone within.”\n\nPublish as a discovered field entry only after the mineral has a recognizable admitted appearance and an actual discovery source. Gathering tips and recipes should be populated from the implemented resource contract, not copied from provisional production choices.\n\n## Evidence needed next\n\nIndependently select the usable target and its material adaptation. Then review the actual constructed front, sides, back, underside and 96/48px views. Later placement needs a matching ordinary portrait screenshot, readable interaction if harvested, actual support/collision, streamed state and saved depletion/regrowth proof as applicable. No such model or gameplay result is claimed by the illustration.\n\n## Reuse and variation review\n\nThe main wedge, shorter tooth, low split plate and bedrock foot are potential authored kit parts. Existing stone remains the proposed yield for each harvested stone part; surface staining is not a separate loot material. Two or three variations could shift which tooth dominates, rotate the short wedge, use modest height differences and vary the gray/olive balance within this mineral family. Preserve coherent fracture directions and substantial grounded bases; do not scale all axes independently until the rock becomes a thin spike.\n\nFor a first placed study, a connected fixed outcrop may be the shortest useful result. A later intentionally multipart version can serve varied scenery and composite harvesting. Separate parts need deliberate interfaces and support rules, but the reference need not be copied object-for-object. Judge the actual placement for visual variety and approachable harvest surfaces rather than exact target likeness.\n"},{"file":"constituents/trailgloam.md","title":"Trailgloam — a patient observer beneath the roots","body":"# Trailgloam — a patient observer beneath the roots\r\n\r\n**Dossier key:** `rootbound.species.trailgloam`. **Working species ID:** `trailgloam`, not registered in game. **Status:** retained textured TRELLIS derivative with 59,376 triangles and 42 inspection views; actual anatomy is eight legs, four per side. The 1,804,432-triangle master remains preserved. A fitted 29-bone rig and exported eight-leg diagnostic are now retained; gameplay motion and runtime admission remain pending. Manual R6 preserved; R7 hoof repair paused. Construction sheet retained; older model and single-image-generation holds remain historical. **Audience:** designer draft and proposed field-entry source.\r\n\r\n## Original illustrated body plan\r\n\r\n![Trailgloam complementary-view construction reference; not six separate animals or gameplay evidence](../../../../art/source/trailgloam-v1/multiview/trailgloam-orthographic-v1.png)\r\n\r\nThe original agent-proposed construction sheet shows a low charcoal/dusky-teal saucer body on six thick articulated legs. The retained TRELLIS model has eight, which are kept as a useful variation; this sheet is historical design direction rather than its rigging template. Two opaque amber dorsal fronds rise from separate sockets; small ivory eyes and one restrained amber seam complete the identity. The fronds are solid folded forms, not transparent wings or floating lights. Complementary top and side views establish the six attachments; an occluded foot in a front view is not evidence of a missing leg.\r\n\r\nThe [independent sheet review](../../../species/rootbound-native/independent-anatomy-review-v1.md) permits construction reference only. The sheet is unsuitable as direct single-image TRELLIS input. The latest owner TRELLIS-first direction prompted a separate experimental input review. The [selected single-subject target](../../../../art/source/trailgloam-v1/rotation-1-reference/target-v2.png) is now [approved for one TRELLIS experiment](../../../../art/source/trailgloam-v1/trellis-trial/reference-review.md): normal far-side occlusion is declared uncertainty, and hidden-side anatomy required post-generation inspection. The later rig inspection establishes eight usable legs, superseding the earlier assumed six-leg count without requiring limb removal. Earlier input holds are historical. The prepared manual hoof repair is paused before Blender execution.\r\n\r\n## TRELLIS conditioning target\r\n\r\n![Selected generated Trailgloam target; not a TRELLIS output or game screenshot](../../../../art/source/trailgloam-v1/rotation-1-reference/target-v2.png)\r\n\r\nUse TRELLIS for the organic master and Blender for useful cleanup and targeted anatomical repair. Do not confuse the manual R6 model below with a TRELLIS result.\r\n\r\n## Actual TRELLIS model\r\n\r\n![Actual Trailgloam TRELLIS geometry in neutral inspection clay; not generated texture or gameplay](../../../../art/source/trailgloam-v1/trellis-trial/geometry-ply-v1/inspection/three-quarter-512.png)\r\n\r\n[Reference versus actual models and trial receipts](../../../../art/source/trailgloam-v1/trellis-trial/review.html). This 34.13MB PLY preserves 889,679 vertices and 1,804,432 triangles. Blender imported the float32 coordinates and triangle order exactly. Keep this master and the successful separately simplified textured derivative from TRELLIS's own postprocess. Raw surface edge defects are cleanup diagnostics; they do not erase the useful shape. No new Wildkin is registered or spawned.\r\n\r\n## First fitted motion study\r\n\r\n![Actual textured Trailgloam loaded rig pose in Three.js](../../../../art/reviews/trailgloam-rig-r1/loaded-three-quarter.png)\r\n\r\nThe retained eight-leg TRELLIS surface now has a fitted 29-bone rig and a complete 1.1-second alternating four-foot diagnostic. Independent review retains the usable fit: no visible stretching or detached hooves in the matched neutral, loaded and gait frames. Its 59,376 triangles and UVs are preserved. The 0.9m scale and 8cm body compression are provisional. Cuff seams, blocky hooves and upright fronds remain art debt; actual gameplay travel, transitions, collision and the full clip set remain unproven. [Illustrated actual motion review and interactive export](../../../../art/reviews/trailgloam-rig-r1/review.html).\r\n\r\n## Draft field entry\r\n\r\n“In the hush beside old logs, two amber fronds turn above a dark shell. Trailgloam waits for the hurried footsteps to pass. Watch quietly and its patient searching may draw your eye to something you overlooked.”\r\n\r\nThis describes intended fiction, not a current encounter or an unlocked journal entry. No discovery reward is specified.\r\n\r\n## Ecological dossier\r\n\r\n| Topic | Proposed design | Practical constraint |\r\n| --- | --- | --- |\r\n| Home | One dry floor pocket on Lantern Grove's humid deadwood edge | Select inside the mapped Grove envelope only after actual ground, camera and retreat inspection; no spawn coordinate is admitted |\r\n| Climate | Cool shaded grove, approximately 10–15°C daytime design range, high relative moisture | Art/ecology cues only; no temperature or wetness simulation |\r\n| Food association | A decomposing-wood/fungal forager that accepts a berry lure | Wild diet is lore design; berry bonding is a proposed reuse of the existing supply transaction |\r\n| Shelter | Low root valleys and fallen logs near a clear floor apron | Do not enclose its home under a root that the current follower cannot traverse |\r\n| Activity | Patient searching and brief frond turns toward nearby activity | No day/night schedule or time-dependent spawn rule is implemented |\r\n| Disturbance | Retreat when rushed or struck | Needs actual readable telegraphs and a supported retreat; no new combat role |\r\n| Regional materials | Nearby Lanterncap/ordinary forage gives the encounter a visible reason | Regional labels remain proposed; no invented food item or resource spawn |\r\n\r\nMeadow-to-Grove transitions should make discovering it feel earned: brighter open floor, then lower light and clustered deadwood cues. Do not place an identical specimen in each room. The Verge remains a contrasting exposed seam rather than another Trailgloam habitat.\r\n\r\n## Proposed play loop\r\n\r\nObserve the fronds from the clear apron, place a berry lure on usable ground, step back during inspection, then approach quietly to bond. Bank the captured individual through the existing physical return, select it for a later outing, and call **Spore Sense** near ordinary available resources. The cue should point briefly to one nearby existing source; collection still uses the normal tool. No source means no charged cooldown and no misleading marker.\r\n\r\nThe independently reviewed [gameplay plan](../../../species/rootbound-native/rotation-1-gameplay-plan.md) specifies a provisional 12m horizontal search, 2.2m vertical limit, 1.2s cue and 8s cooldown. Those are tuning proposals, not implemented behavior. It reuses the existing lure/feed/ready capture transaction; no supplies are promised back after an ordinary interruption. Save rejection must preserve the existing retry behavior. The cue never proves that a resource behind a root is reachable.\r\n\r\n## Differentiation and knowledge layers\r\n\r\nMossling offers recovery and living-root interactions; Trailgloam would help notice one nearby collection opportunity. It must not become a mandatory route key, healer, mineral breaker or automatic harvester. Camp production, breeding, genetics, maintenance and special drops are not part of first admission.\r\n\r\nBasic journal prose can reveal the shell/fronds and patient temperament. Practical bonding and companion tips stay draft until their corresponding gameplay is proven. Internal coordinates, source IDs, cooldown filters and future hidden discoveries belong in production notes rather than player prose.\r\n\r\n## Model history and next feasible method\r\n\r\nPreserve the reviewed sheet and all earlier manual work. R1/R2 blockouts exist; the [R3 shell-port audit](../../../../art/source/trailgloam-v1/manual-blockout-v1/r3-terminal-audit-hold.md) stopped before a new mesh or render. The old card's statement that no model work existed was stale. None of those candidates is admitted, rigged or spawned.\r\n\r\nA future changed-method candidate could use independently closed shell and articulated leg segments, with measured overlaps hidden inside dark joint cuffs, rather than repeatedly attempting one perforated shell with welded leg ports. That is a provisional modeling proposal requiring independent feasibility review, not permission to hide visible gaps or skip grounded six-leg motion. A beetle's segmented anatomy may suit this construction, but actual rendered attachments and joint poses must prove it.\r\n\r\nThe [segmented R4 planning review](../../../../art/source/trailgloam-v1/segmented-r4-plan/independent-review.md) now closes HOLD after one focused proof correction. It retains the segmented-cuff idea but rejects claimed closure/contact evidence based on names, proxy boxes/capsules and copied overlap requirements. The revised 2.14 × 2.08 × 1.8025m bound is a planning proxy, not an actual model envelope. No R4 Blender build was launched. A later builder needs actual generated solids and measured contacts before proceeding; do not repeat the same planning loop or promote its receipt into anatomy proof.\r\n\r\nThe earlier manual plan's 1.45 × 1.55 × 1.70m headline envelope is not a current production promise: later reviews found its foot extents inconsistent. Recompute the entire envelope from the chosen parameters before construction. No exact real-world size was recovered from the sheet.\r\n\r\n## Admission still required\r\n\r\nFit the retained actual model with eight distinct leg chains, two substantial frond roots, clean underside/feet and readable 48/96px silhouettes. Then establish fitted eight-leg locomotion, frond movement, actual exported scale/materials and collider fit. Only one cohesive species admission can add catalog, individual validation, encounter, bonding and cue presentation. Ordinary discover/bond/return/select/use/reload proof and sibling-companion preservation remain required. Neither this dossier nor its illustrations implements those systems.\r\n\r\n## Actual one-limb construction probe\r\n\r\n![Actual Blender partial Trailgloam test, one articulated limb and one largely obscured frond](../../../../art/source/trailgloam-v1/method-probe-r5/render-r5/three-quarter-512.png)\r\n\r\nThe changed-method R5 probe builds ten actual closed solids / 264 triangles: one supporting body, one three-segment limb with cuffs and hoof, and one collar/blade pair. Independent CPU reproduction and Blender float32/index parity pass; all named CPU contact measurements pass. One guarded Blender run supplies nine real side/three-quarter/underside images at 512/96/48px.\r\n\r\nThe bent limb and closed joins are useful, but the dark collar hides almost all of the amber blade. Keep the attachment lesson without claiming a successful full species or target match. The remaining five legs, head, second frond, animation and gameplay are absent. Review blade exposure and collar proportions before a separately planned full build. [Illustrated partial test](../../../../art/source/trailgloam-v1/method-probe-r5/review.html) · [Independent visual review](../../../../art/source/trailgloam-v1/method-probe-r5/visual-review.md).\r\n\r\n## Complete model from the new construction method\r\n\r\n![Actual complete Trailgloam model with six articulated legs, forward face and two amber fronds](../../../../art/source/trailgloam-v1/full-r6/candidate-r6/three-quarter-512.png)\r\n\r\nOne full Blender candidate now exists: 50 separate closed solids / 1,024 triangles, a proposed 2.34 × 2.27 × 1.643m envelope, six grounded feet, visible ivory eyes and two exposed amber folds. Twenty-one actual views cover seven directions at 512/96/48px. The new candidate fixes the partial probe's hidden fronds. Large block-like feet remain visible art debt; evaluate their effect on the creature rather than rejecting different target proportions by rule.\r\n\r\nThe reviewed CPU construction is the source of the actual mesh arrays, and Blender verifies float32 XYZ/index/topology/winding and hoof grounding. Small root-anchor insets fixed four shallow surface protrusions before the one full build; other body proportions and frond exposure remain unchanged. This is a neutral model candidate, not an animated or playable species. [Actual illustrated model](../../../../art/source/trailgloam-v1/full-r6/review.html) · [Independent review](../../../../art/source/trailgloam-v1/full-r6/visual-review.md) · [Execution facts](../../../../art/source/trailgloam-v1/full-r6/execution-receipt.json).\r\n\r\nIndependent full-model decision: **retain with specific debt**. Preserve the teal body/forward face, six grounded chains and visible amber cues. Focus any next mesh repair on the oversized dark hooves rather than rebuilding the creature to match the concept exactly.\r\n\r\n## Retained TRELLIS organic master\r\n\r\n![Actual TRELLIS Trailgloam geometry shown with neutral teal inspection clay](../../../../art/source/trailgloam-v1/trellis-trial/geometry-ply-v1/inspection/three-quarter-512.png)\r\n\r\nThe current preferred organic master is the actual TRELLIS result: 889,679 vertices and 1,804,432 triangles, preserved unchanged with an exact Blender import and 21 neutral views. The first review mistakenly reported six legs; closer top and side inspection establishes eight. Independent review retains that anatomy and its stronger organic body/feet. The teal above is inspection clay, not a generated texture. The manual foot repair is paused, and its earlier candidate remains preserved.\r\n\r\nBuilt-in TRELLIS remeshing, simplification, UV generation and texture baking are being tested as a separate export stage. A dense raw master is an intermediate asset, not a model rejection. The first standalone attempt reproduced that master exactly but stopped on a Windows flex_gemm import error before mesh processing; the saved decoded state allows a focused export retry without regenerating the creature. Follow the [actual comparison and latest export evidence](../../../../art/source/trailgloam-v1/trellis-trial/review.html). Rigging, animation, encounter and runtime admission remain separate outstanding work.\r\n\r\nThe native postprocess retry now **succeeds**: a textured59,376-triangle GLB (3.89MB), with42 actual matched textured/neutral inspection views and an editable Blender scene. Independent review retains the teal shell, amber fronds, warm face and readable leg ring as the preferred next production asset. The high-detail master remains intact. Next is fitted scale and six-leg rig/topology preparation, not another visual rebuild or immediate encounter placement. [Actual reduced model and review](../../../../art/source/trailgloam-v1/trellis-trial/review.html#simplified).\r\n"},{"file":"constituents/wildkin.md","title":"Wildkin — Rootbound relationships and field dossiers","body":"# Wildkin — Rootbound relationships and field dossiers\n\n**Dossier key:** `rootbound.ecology.wildkin`. **Status:** verified source inventory plus proposed regional design. **Audience:** production draft; not a published player journal.\n\nRootbound should reward noticing how creatures use the woodland. Mossling supplies the familiar cautious grazer; Trailgloam would add a patient observer at the damp deadwood edge. Their roles, silhouettes and discovery cues should remain distinct.\n\n## Current source facts\n\nThe [reproducible default-world census](../../../../art/reviews/rootbound-wildwood/dossier-ecology/census.json) finds **two Mossling source placements** inside the 200m Rootbound bounds. Their homes are in the retained eastern woodland, outside the proposed five-room circuit. This is procedural source evidence, not a claim that both are currently loaded or uncaptured in a player's save. Neither resident was moved or replaced.\n\n**Bloom is Mossling's companion ability, not another species or a placeable flower.** Earlier dossier wording blurred this distinction. Pale blooms/fungi below are proposed vegetation, with their own forage/decor card. The current catalog and individual allow-list contain no Trailgloam entry.\n\n| Species | Current state | Rootbound design role | Full dossier |\n| --- | --- | --- | --- |\n| Mossling | Existing species; two deterministic source homes in eastern woodland | Cautious grazer on supported open floor; its future relationship to the planned outing needs actual placement proof | [Mossling](mossling.md) |\n| Trailgloam | Unshipped design and reference candidate; earlier manual meshes held | One optional Lantern Grove deadwood-edge encounter; patient bonding and a short nearby-resource cue | [Trailgloam](trailgloam.md) |\n\n## Planned distribution and ecological transitions\n\n| Subhabitat | Creature role to compose | Visible cues | What is still unproven |\n| --- | --- | --- | --- |\n| Orientation Meadow | A readable place to observe a Mossling if a later cohesive placement supplies one | Open supported floor, low forage margins, retreat cover at one edge | Current source homes are elsewhere; no Meadow resident is asserted |\n| Root Galleries | A transition, with occasional views into sheltered creature pockets | Broad root valleys and clear floor rather than dense scatter | No creature should be positioned merely to fill every room |\n| Lantern Grove | Proposed Trailgloam niche on the dry lip beside damp deadwood | Amber fronds contrast with shaded teal/green; low fungi cluster at the same log | Model, supported home, encounter and bond all pending |\n| Thornstone Verge | A quieter exposed seam, preserving contrast with sheltered creature rooms | Short cover and mineral outcrops; no mandatory encounter | No new predator or regional species assigned |\n| Heartroot Crown | Shelter and an orientation landmark; creature use remains optional | Open apron, old root collar, an unobstructed return view | Crown is not verified as the earned grove or a present creature home |\n\nThe climate differences are art/ecology direction, not simulated temperature requirements. A creature's range should follow a useful floor pocket; do not give every subhabitat an evenly spaced population. Existing homes and stable identities remain protected while future encounters are designed.\n\n## Shared knowledge and implementation boundaries\n\nThe [independent species dossier review](../species-dossier-review.md) passes these chapters as production and future-journal source material, with runtime admission still separate.\n\nEach species dossier separates field prose, observed/source-backed facts, proposed play and production notes. Future journal content may draw from those facts after matching gameplay proof. A construction sheet explains anatomy; it is not a screenshot of an encounter. A visual HOLD does not erase the selected species concept or useful parts.\n\nPreserve the existing capture, bank, individual, companion and save owners. Trailgloam would need one cohesive catalog/encounter/visual/bond/ability admission; it cannot be added by naming a model alone. New resident count, supported home, clear retreat and ordinary discover/bond/return/use/reload proof remain integration gates. No behavior, home, reward or save state changed in this dossier pass.\n"}];const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function render(page){const url=new URL(page.file,location.href.split('#')[0]);const inline=t=>esc(t).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,href)=>{const link=new URL(href,url);const internal=pages.find(p=>new URL(p.file,location.href.split('#')[0]).pathname===link.pathname);return '<a href="'+(internal?'#'+encodeURIComponent(internal.file):esc(link.href))+'">'+label+'</a>'}).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>');let rows=page.body.split(/\r?\n/),out='',list=false,table=false;
for(let row of rows){if(row.startsWith('|')){if(!table){out+='<table>';table=true}if(/^\|[ :|\-]+$/.test(row))continue;const cells=row.split('|').slice(1,-1);out+='<tr>'+cells.map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>';continue}if(table){out+='</table>';table=false}const li=/^\s*(?:[-*]|\d+\.) (.*)/.exec(row);if(li){if(!list){out+='<ul>';list=true}out+='<li>'+inline(li[1])+'</li>';continue}if(list){out+='</ul>';list=false}if(!row.trim())continue;const im=/^!\[([^\]]*)\]\(([^)]+)\)$/.exec(row);if(im){out+='<figure><img loading="lazy" src="'+esc(new URL(im[2],url).href)+'" alt="'+esc(im[1])+'"><figcaption>'+esc(im[1])+'</figcaption></figure>';continue}const h=/^(#{1,4}) (.*)/.exec(row);out+=h?'<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>':'<p>'+inline(row)+'</p>'}return out+(table?'</table>':'')+(list?'</ul>':'')}
function show(){const chosen=pages.find(p=>p.file===decodeURIComponent(location.hash.slice(1)))||pages[0];document.querySelector('nav').innerHTML=pages.map(p=>'<a href="#'+encodeURIComponent(p.file)+'" aria-current="'+(p===chosen)+'">'+esc(p.title)+'</a>').join('');document.querySelector('main').innerHTML='<div class="source"><a href="'+chosen.file+'">Markdown source</a></div>'+render(chosen);document.title=chosen.title+' · Rootbound dossier'}window.addEventListener('hashchange',show);show();
</script></html>
