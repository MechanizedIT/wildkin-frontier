# Wildkin Frontier project-scoped Codex settings.
# The primary session is not counted in this spawned-thread ceiling.
# Workflow rules still cap simultaneous writers and serialize GPU-heavy work.

[agents]
enabled = true
max_concurrent_threads_per_session = 6
interrupt_message = true

[mcp_servers.unity]
command = "C:\\Users\\cwood\\AppData\\Local\\Unity\\bin\\unity.exe"
args = ["mcp","--project-path","C:\\Users\\cwood\\Documents\\mobile-rpg\\native\\unity\\WildkinUnity"]

[sandbox_workspace_write]
network_access = true

[features.network_proxy]
enabled = true
allow_local_binding = false

[features.network_proxy.domains]
localhost = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"
